    <script>

        const IMAGE_TOKEN_STORAGE_KEY = "shushi_image_api_token";

        let rows = [];

        let dayImagePreviewErrorGeneration = -1;

        const dayTitle = document.getElementById("dayTitle");
        const dayList = document.getElementById("dayList");
        const dayEmpty = document.getElementById("dayEmpty");
        const daySummaryDate = document.getElementById("daySummaryDate");
        const daySummaryList = document.getElementById("daySummaryList");
        const editorOverlay = document.getElementById("editorOverlay");
        const editorTitle = document.getElementById("editorTitle");
        const editorInvest = document.getElementById("editorInvest");
        const editorRecover = document.getElementById("editorRecover");
        const editorProfit = document.getElementById("editorProfit");
        const editorDelete = document.getElementById("editorDelete");
        const editorImageInput = document.getElementById("editorImageInput");
        const editorImageStatus = document.getElementById("editorImageStatus");
        const editorImageList = document.getElementById("editorImageList");
        const ticketImageViewer = document.getElementById("ticketImageViewer");
        const ticketImageViewerImage = document.getElementById("ticketImageViewerImage");
        const ticketImageViewerImageViewport = document.getElementById("ticketImageViewerImageViewport");
        const imageTokenDialog = document.getElementById("imageTokenDialog");
        const imageTokenForm = document.getElementById("imageTokenForm");
        const imageTokenInput = document.getElementById("imageTokenInput");
        const buyerBtns = Array.from(document.querySelectorAll(".buyer-btn"));
        const fabEdit = document.getElementById("fabEdit");
        const yearFilter = document.getElementById("yearFilter");
        let editorDate = "";
        let editorBuyer = "上田";
        let editingUid = null;
        let editorForceNew = false;
        let lastBuyer = "上田";

        if (editorInvest) editorInvest.addEventListener("input", () => { sanitizeNumberInput(editorInvest); updateEditorProfit(); });
        if (editorRecover) editorRecover.addEventListener("input", () => { sanitizeNumberInput(editorRecover); updateEditorProfit(); });

        buyerBtns.forEach(btn => {
            btn.addEventListener("click", () => setEditorBuyer(btn.dataset.buyer || "上田"));
        });

        if (editorImageInput) editorImageInput.addEventListener("change", queueEditorImages);
        if (editorImageList) editorImageList.addEventListener("click", handleEditorImageListClick);
        document.getElementById("ticketImageViewerClose").addEventListener("click", closeTicketImageViewer);
        document.getElementById("ticketImageViewerPrev").addEventListener("click", () => moveViewerImage(-1));
        document.getElementById("ticketImageViewerNext").addEventListener("click", () => moveViewerImage(1));
        ticketImageViewer.addEventListener("click", e => {
            if (e.target === ticketImageViewer) closeTicketImageViewer();
        });
        ticketImageViewer.addEventListener("wheel", handleViewerWheel, { passive: false });
        ticketImageViewer.addEventListener("touchstart", handleViewerTouchStart, { passive: false });
        ticketImageViewer.addEventListener("touchmove", handleViewerTouchMove, { passive: false });
        ticketImageViewer.addEventListener("touchend", handleViewerTouchEnd, { passive: false });
        ticketImageViewer.addEventListener("touchcancel", handleViewerTouchCancel, { passive: false });
        ticketImageViewerImage.addEventListener("pointerdown", handleViewerMousePanStart);
        ticketImageViewerImage.addEventListener("pointermove", handleViewerMousePanMove);
        ticketImageViewerImage.addEventListener("pointerup", handleViewerMousePanEnd);
        ticketImageViewerImage.addEventListener("pointercancel", handleViewerMousePanEnd);
        ticketImageViewerImage.addEventListener("lostpointercapture", handleViewerMousePanEnd);
        imageTokenForm.addEventListener("submit", e => {
            e.preventDefault();
            const token = imageTokenInput.value.trim();
            if (token) finishImageTokenPrompt(token);
        });
        document.getElementById("imageTokenCancel").addEventListener("click", () => finishImageTokenPrompt());
        imageTokenDialog.addEventListener("cancel", e => {
            e.preventDefault();
            finishImageTokenPrompt();
        });
        imageTokenDialog.addEventListener("click", e => {
            if (e.target === imageTokenDialog) finishImageTokenPrompt();
        });
        document.addEventListener("keydown", e => {
            if (imageTokenDialog.open) return;
            if (!ticketImageViewer.classList.contains("show")) return;
            if (e.key === "Escape") closeTicketImageViewer();
            if (e.key === "ArrowLeft") moveViewerImage(-1);
            if (e.key === "ArrowRight") moveViewerImage(1);
        });

        let viewMonth = "";
        let selectedDate = "";

        function todayJST() {
            return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
        }

        function pad2(n) { return String(n).padStart(2, "0"); }

        function ymFromDate(d) { return d && d.length >= 7 ? d.slice(0, 7) : ""; }

        function formatMonthTitle(ym) {
            const y = ym.slice(0, 4);
            const m = String(parseInt(ym.slice(5, 7), 10));
            return `${y}年${m}月`;
        }

        function formatDayLabel(d) {
            if (!d || d.length < 10) return "";
            const mm = Number(d.slice(5, 7));
            const dd = Number(d.slice(8, 10));
            if (!mm || !dd) return "";
            return `${mm}月${dd}日`;
        }

        function formatYen(n) {
            const num = Number(n);
            if (!isFinite(num) || num === 0) return "0円";
            if (num < 0) return "-" + Math.abs(num).toLocaleString() + "円";
            return num.toLocaleString() + "円";
        }

        function formatProfitSpan(n) {
            if (n > 0) return `<span class="profit">${formatYen(n)}</span>`;
            if (n < 0) return `<span class="loss">${formatYen(n)}</span>`;
            return `<span>0円</span>`;
        }

        function parseYen(s) {
            return Number(String(s || "").replace(/[円,]/g, "")) || 0;
        }

        function sanitizeNumberInput(el) {
            el.value = el.value.replace(/[^\d]/g, "");
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>"']/g, ch => {
                if (ch === "&") return "&amp;";
                if (ch === "<") return "&lt;";
                if (ch === ">") return "&gt;";
                if (ch === '"') return "&quot;";
                return "&#39;";
            });
        }

        function normalizeRecordDate(value) {
            const date = String(value ?? "");
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return "";
            const parsed = new Date(`${date}T00:00:00.000Z`);
            return !Number.isNaN(parsed.valueOf()) && parsed.toISOString().slice(0, 10) === date ? date : "";
        }

        function isValidTicketImageId(value) {
            return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value ?? ""));
        }

        function normalizeTicketImages(images) {
            if (!Array.isArray(images)) return [];
            return images
                .filter(image => image && isValidTicketImageId(image.id))
                .map(image => ({
                    id: String(image.id),
                    name: String(image.name || "買い目画像"),
                    type: String(image.type || "image/jpeg")
                }));
        }

        function getImageApiToken() {
            let token = localStorage.getItem(IMAGE_TOKEN_STORAGE_KEY) || "";
            if (token) return Promise.resolve(token);
            if (imageTokenPromise) return imageTokenPromise;

            imageTokenInput.value = "";
            imageTokenPromise = new Promise((resolve, reject) => {
                imageTokenResolve = resolve;
                imageTokenReject = reject;
            });
            imageTokenDialog.showModal();
            requestAnimationFrame(() => imageTokenInput.focus());
            return imageTokenPromise;
        }

        function finishImageTokenPrompt(token = "") {
            if (!imageTokenPromise) return;
            const resolve = imageTokenResolve;
            const reject = imageTokenReject;
            imageTokenPromise = null;
            imageTokenResolve = null;
            imageTokenReject = null;
            if (imageTokenDialog.open) imageTokenDialog.close();

            if (token) {
                localStorage.setItem(IMAGE_TOKEN_STORAGE_KEY, token);
                resolve(token);
            } else {
                imageTokenInput.value = "";
                reject(new Error("アクセスキー未入力"));
            }
        }

        async function imageApiRequest(path, options = {}) {
            const token = await getImageApiToken();
            const headers = new Headers(options.headers || {});
            headers.set("Authorization", `Bearer ${token}`);
            const response = await fetch(`${IMAGE_API_URL}${path}`, { ...options, headers });

            if (response.status === 401) {
                localStorage.removeItem(IMAGE_TOKEN_STORAGE_KEY);
                throw new Error("アクセスキー不正");
            }

            if (!response.ok) {
                let message = "画像処理失敗";
                try {
                    const data = await response.clone().json();
                    if (data && data.error === "image service is not configured") {
                        message = "画像保存先未設定";
                    } else if (data && data.error === "unsupported image type") {
                        message = "非対応画像形式";
                    } else if (data && data.error === "image too large") {
                        message = "画像サイズ超過";
                    }
                } catch { }
                throw new Error(message);
            }
            return response;
        }

        async function dataApiRequest(options = {}) {
            const token = await getImageApiToken();
            const headers = new Headers(options.headers || {});
            headers.set("Authorization", `Bearer ${token}`);
            const response = await fetch(API_URL, { ...options, headers });

            if (response.status === 401) {
                localStorage.removeItem(IMAGE_TOKEN_STORAGE_KEY);
                throw new Error("アクセスキー不正");
            }
            return response;
        }

        function imageErrorMessage(error) {
            if (error instanceof TypeError) return "画像Worker接続失敗";
            const message = String(error?.message || "");
            if (message.includes("アクセスキー")) return message.includes("未入力") ? "アクセスキー未入力" : "アクセスキー不正";
            if (message.includes("R2") || message.includes("保存先")) return "画像保存先未設定";
            if (message.includes("unsupported image type") || message.includes("画像形式")) return "非対応画像形式";
            if (message.includes("画像ID") || message.includes("画像登録")) return "画像登録失敗";
            return "画像処理失敗";
        }

        function setDayImagePreviewSignature(signature) {
            if (signature === dayImagePreviewSignature) return;
            dayImagePreviewGeneration++;
            if (dayImagePreviewObserver) {
                dayImagePreviewObserver.disconnect();
                dayImagePreviewObserver = null;
            }
            dayImagePreviewUrls.forEach(url => URL.revokeObjectURL(url));
            dayImagePreviewUrls.clear();
            dayImagePreviewRequests.clear();
            dayImagePreviewSignature = signature;
            dayImagePreviewErrorGeneration = -1;
        }

        function observeDayImagePreviews() {
            if (!daySummaryList) return;
            if (dayImagePreviewObserver) dayImagePreviewObserver.disconnect();
            const generation = dayImagePreviewGeneration;
            const pendingImages = Array.from(daySummaryList.querySelectorAll("img[data-day-image-id]:not([src])"));
            if (!pendingImages.length) return;

            if ("IntersectionObserver" in window) {
                dayImagePreviewObserver = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        dayImagePreviewObserver?.unobserve(entry.target);
                        void loadDayImagePreview(entry.target, generation);
                    });
                }, { rootMargin: "160px 0px" });
                pendingImages.forEach(image => dayImagePreviewObserver.observe(image));
            } else {
                pendingImages.forEach(image => void loadDayImagePreview(image, generation));
            }
        }

        async function loadDayImagePreview(imageElement, generation) {
            if (generation !== dayImagePreviewGeneration) return;
            const imageId = imageElement.dataset.dayImageId;
            if (!imageId) return;

            const cachedUrl = dayImagePreviewUrls.get(imageId);
            if (cachedUrl) {
                setDayImagePreviewUrl(imageId, cachedUrl, generation);
                return;
            }

            let request = dayImagePreviewRequests.get(imageId);
            if (!request) {
                request = (async () => {
                    const response = await imageApiRequest(`/images/${encodeURIComponent(imageId)}`);
                    const url = URL.createObjectURL(await response.blob());
                    if (generation !== dayImagePreviewGeneration) {
                        URL.revokeObjectURL(url);
                        return "";
                    }
                    dayImagePreviewUrls.set(imageId, url);
                    return url;
                })();
                dayImagePreviewRequests.set(imageId, request);
            }

            try {
                const url = await request;
                if (url && generation === dayImagePreviewGeneration) {
                    setDayImagePreviewUrl(imageId, url, generation);
                }
            } catch (error) {
                if (generation === dayImagePreviewGeneration) {
                    daySummaryList.querySelectorAll(".day-entry-image-thumb img[data-day-image-id]").forEach(image => {
                        if (image.dataset.dayImageId !== imageId) return;
                        image.closest(".day-entry-image-thumb")?.classList.add("is-error");
                    });
                    if (dayImagePreviewErrorGeneration !== generation) {
                        dayImagePreviewErrorGeneration = generation;
                        showToast(imageErrorMessage(error), { type: "error" });
                    }
                }
            } finally {
                if (generation === dayImagePreviewGeneration) dayImagePreviewRequests.delete(imageId);
            }
        }

        function setDayImagePreviewUrl(imageId, url, generation) {
            if (generation !== dayImagePreviewGeneration) return;
            daySummaryList.querySelectorAll(".day-entry-image-thumb img[data-day-image-id]").forEach(image => {
                if (image.dataset.dayImageId === imageId) {
                    image.src = url;
                    image.closest(".day-entry-image-thumb")?.classList.remove("is-error");
                }
            });
        }

        function startEdit(el) {
            const v = el.value ? String(parseYen(el.value)) : "";

            el.select();

        let toastHideTimer = null;
        let toastFadeTimer = null;
        const LOADING_TIMEOUT = 30000;

        function showToast(message, { type = "info", duration = 2000 } = {}) {
            let el = document.querySelector(".ns-toast");
            if (toastHideTimer) { clearTimeout(toastHideTimer); toastHideTimer = null; }
            if (toastFadeTimer) { clearTimeout(toastFadeTimer); toastFadeTimer = null; }

            if (!el) {
                el = document.createElement("div");
                el.className = "ns-toast";
                document.body.appendChild(el);
            }

            el.setAttribute("role", type === "error" ? "alert" : "status");
            el.setAttribute("aria-live", type === "error" ? "assertive" : "polite");

            el.dataset.type = type;
            el.dataset.visible = "0";
            el.textContent = message;

            requestAnimationFrame(() => {
                el.dataset.visible = "1";
            });

            const effectiveDuration = type === "loading" ? LOADING_TIMEOUT : duration;
            toastHideTimer = setTimeout(() => {
                el.dataset.visible = "0";
                toastFadeTimer = setTimeout(() => el.remove(), 200);
            }, effectiveDuration);
        }

        function rebuildYearOptions() {
            if (!yearFilter) return;

            const years = Array.from(new Set(
                rows
                    .map(r => (r.date || "").slice(0, 4))
                    .filter(y => y && y.length === 4)
            )).sort((a, b) => Number(b) - Number(a));

            const saved = localStorage.getItem("shushi_year_filter") || "all";
            const current = yearFilter.value || saved || "all";

            yearFilter.replaceChildren();
            const allOption = document.createElement("option");
            allOption.value = "all";
            allOption.textContent = "全期間";
            yearFilter.append(allOption);
            years.forEach(year => {
                if (!/^\d{4}$/.test(year)) return;
                const option = document.createElement("option");
                option.value = year;
                option.textContent = `${year}年`;
                yearFilter.append(option);
            });
            yearFilter.value = (current !== "all" && years.includes(current)) ? current : "all";
        }

        function getYearFilterValue() {
            if (!yearFilter) return "all";
            return yearFilter.value || "all";
        }

        function fitYearFilterWidth() {
            if (!yearFilter) return;

            const opt = yearFilter.options[yearFilter.selectedIndex];
            const text = opt ? opt.text : "";

            let meas = document.getElementById("yearMeasure");
            if (!meas) {
                meas = document.createElement("span");
                meas.id = "yearMeasure";
                meas.style.position = "absolute";
                meas.style.visibility = "hidden";
                meas.style.whiteSpace = "pre";
                meas.style.pointerEvents = "none";
                document.body.appendChild(meas);
            }

            const cs = getComputedStyle(yearFilter);
            meas.style.font = cs.font;
            meas.style.fontWeight = cs.fontWeight;
            meas.textContent = text;

            const w = meas.getBoundingClientRect().width;
            yearFilter.style.width = Math.ceil(w + 2) + "px";
        }

        function applyYearFilter() {
            if (!yearFilter) {
                calc();
                return;
            }

            const y = getYearFilterValue();
            localStorage.setItem("shushi_year_filter", y);
            fitYearFilterWidth();
            calc();
        }

        function calc() {
            const yFilter = getYearFilterValue();
            const baseRows = (yFilter === "all") ? rows : rows.filter(r => (r.date || "").slice(0, 4) === yFilter);

            let sumUeda = 0, sumChiba = 0;
            let payUeda = 0, payChiba = 0;

            baseRows.forEach(r => {
                const amount = Number(r.amount) || 0;
                const payout = Number(r.payout) || 0;
                const buyer = r.buyer || "上田";

                if (buyer === "上田") {
                    sumUeda += amount;
                    payUeda += payout;
                } else {
                    sumChiba += amount;
                    payChiba += payout;
                }
            });

            const sumTotal = sumUeda + sumChiba;
            const sumPayout = payUeda + payChiba;
            const profit = sumPayout - sumTotal;

            const profitUeda = payUeda - sumUeda;
            const profitChiba = payChiba - sumChiba;

            const su = document.getElementById("sumUeda");
            if (su) su.innerHTML = `<span>${formatYen(sumUeda)}</span>`;
            const pueda = document.getElementById("payUeda");
            if (pueda) pueda.innerHTML = `<span>${formatYen(payUeda)}</span>`;
            const sc = document.getElementById("sumChiba");
            if (sc) sc.innerHTML = `<span>${formatYen(sumChiba)}</span>`;
            const pchiba = document.getElementById("payChiba");
            if (pchiba) pchiba.innerHTML = `<span>${formatYen(payChiba)}</span>`;
            const st = document.getElementById("sumTotal");
            if (st) st.innerHTML = `<span>${formatYen(sumTotal)}</span>`;
            const sp = document.getElementById("sumPayout");
            if (sp) sp.innerHTML = `<span>${formatYen(sumPayout)}</span>`;

            const pu = document.getElementById("profitUeda");
            if (pu) pu.innerHTML = formatProfitSpan(profitUeda);
            const pc = document.getElementById("profitChiba");
            if (pc) pc.innerHTML = formatProfitSpan(profitChiba);
            const pt = document.getElementById("profitTotal");
            if (pt) pt.innerHTML = formatProfitSpan(profit);

            const profitElem = document.getElementById("profit");
            if (profitElem) {
                if (profit > 0) profitElem.innerHTML = `<span class="profit">${formatYen(profit)}</span>`;
                else if (profit < 0) profitElem.innerHTML = `<span class="loss">${formatYen(profit)}</span>`;
                else profitElem.innerHTML = `<span>0円</span>`;
            }

            const monthRows = getRowsInMonth(viewMonth);
            let monthInvest = 0;
            let monthRecover = 0;

            monthRows.forEach(r => {
                monthInvest += Number(r.amount) || 0;
                monthRecover += Number(r.payout) || 0;
            });

            const monthProfit = monthRecover - monthInvest;

            const mp = document.getElementById("monthProfit");
            const mi = document.getElementById("monthInvest");
            const mr = document.getElementById("monthRecover");

            if (mp) {
                mp.textContent = formatYen(monthProfit);
                mp.classList.toggle("loss", monthProfit < 0);
                mp.classList.toggle("profit", monthProfit > 0);
                if (monthProfit === 0) { mp.classList.remove("loss"); mp.classList.remove("profit"); }
            }
            if (mi) mi.textContent = formatYen(monthInvest);
            if (mr) mr.textContent = formatYen(monthRecover);

            updateDaySummary();
        }

        function updateDaySummary() {
            if (!daySummaryDate || !daySummaryList) return;
            if (!selectedDate) {
                setDayImagePreviewSignature("");
                daySummaryDate.textContent = "";
                daySummaryList.innerHTML = "";
                return;
            }

            const dayRows = rows
                .filter(r => r.date === selectedDate)
                .sort((a, b) => (a.uid || 0) - (b.uid || 0));

            daySummaryDate.textContent = formatDayLabel(selectedDate);

            if (dayRows.length === 0) {
                setDayImagePreviewSignature("");
                daySummaryList.innerHTML = "";
                return;
            }

            const previewEntries = dayRows
                .map(row => [row.uid, normalizeTicketImages(row.images).map(image => image.id)])
                .filter(([, imageIds]) => imageIds.length > 0);
            const previewSignature = previewEntries.length ? JSON.stringify([selectedDate, previewEntries]) : "";
            setDayImagePreviewSignature(previewSignature);

            daySummaryList.innerHTML = dayRows.map(r => {
                const invest = Number(r.amount) || 0;
                const recover = Number(r.payout) || 0;
                const profit = recover - invest;
                const buyer = r.buyer || "上田";
                const images = normalizeTicketImages(r.images);
                const profitClass = profit > 0 ? "profit" : (profit < 0 ? "loss" : "");
                return `
                    <div class="day-summary-entry" data-uid="${r.uid}">
                        <div class="day-entry-profit ${profitClass}">${formatYen(profit)}</div>
                        <div class="day-entry-side">
                            <div class="ms-row">
                                <div>購入</div>
                                <div class="ms-val">${formatYen(invest)}</div>
                            </div>
                            <div class="ms-row">
                                <div>払戻</div>
                                <div class="ms-val">${formatYen(recover)}</div>
                            </div>
                            <div class="ms-row">
                                <div>買主</div>
                                <div class="ms-val">${escapeHtml(buyer)}</div>
                            </div>
                            ${images.length ? `
                                <div class="day-entry-images">
                                    ${images.map((image, index) => {
                                        const previewUrl = dayImagePreviewUrls.get(image.id);
                                        return `
                                            <button class="day-entry-image-thumb" type="button" data-uid="${r.uid}" data-image-index="${index}" aria-label="買い目画像${index + 1}を拡大">
                                                <img data-day-image-id="${escapeHtml(image.id)}" alt="買い目画像${index + 1}" loading="lazy"${previewUrl ? ` src="${escapeHtml(previewUrl)}"` : ""}>
                                            </button>
                                        `;
                                    }).join("")}
                                </div>
                            ` : ""}
                        </div>
                    </div>
                `;
            }).join("");
            observeDayImagePreviews();
        }

        function renderCalendar() {
            const y = parseInt(viewMonth.slice(0, 4), 10);
            const m = parseInt(viewMonth.slice(5, 7), 10);
            const first = new Date(y, m - 1, 1);
            const lastDay = new Date(y, m, 0).getDate();

            const offsetMon = (first.getDay() + 6) % 7;

            const monthRows = getRowsInMonth(viewMonth);
            const profitByDate = new Map();
            const countByDate = new Map();

            monthRows.forEach(r => {
                if (!r.date) return;
                const amount = Number(r.amount) || 0;
                const payout = Number(r.payout) || 0;
                const p = payout - amount;

                profitByDate.set(r.date, (profitByDate.get(r.date) || 0) + p);
                countByDate.set(r.date, (countByDate.get(r.date) || 0) + 1);
            });

            const totalSlots = offsetMon + lastDay;
            const weeks = Math.ceil(totalSlots / 7);
            const cellCount = weeks * 7;

            const cells = [];
            for (let i = 0; i < cellCount; i++) {
                const day = i - offsetMon + 1;

                if (day < 1 || day > lastDay) {
                    cells.push(`<div class="cal-cell outside"></div>`);
                    continue;
                }

                const dateStr = `${viewMonth}-${pad2(day)}`;
                const dow = new Date(y, m - 1, day).getDay();
                const weekClass = dow === 0 ? " sun" : (dow === 6 ? " sat" : "");
                const p = profitByDate.get(dateStr);
                const c = countByDate.get(dateStr) || 0;

                const isSel = dateStr === selectedDate;
                const amt = c ? formatYen(p) : "";
                const amtClass = c ? (p < 0 ? "neg" : (p > 0 ? "pos" : "")) : "";
                const selectedClass = isSel ? " selected" : "";

                cells.push(
                    `<div class="cal-cell${weekClass}${selectedClass}" data-date="${dateStr}">
                                <div class="cal-dayline">
                                    <div class="cal-daynum"><span class="cal-daychip">${day}</span></div>
                                </div>
                                ${c ? `<div class="cal-amt ${amtClass}">${amt}</div>` : ``}
                            </div>`
                );
            }

            calGrid.innerHTML = cells.join("");
        }

        function ensureSelectedInMonth() {

        function formatEditorTitle(d, isEdit) {
            if (!d || d.length < 10) return "";
            const mm = Number(d.slice(5, 7));

            const s = `${mm}月${dd}日の収支を${isEdit ? "編集" : "入力"}`;

        function setEditorBuyer(b) {
            if (imageUploadInProgress || editorSaveInProgress) {
                showToast(imageUploadInProgress ? "画像処理中です" : "保存中です");
                return;
            }
            const nextBuyer = b || "上田";
            if (nextBuyer !== editorBuyer && (editorUploadedImageIds.size || editorPendingImageFiles.length)) {
                clearPendingEditorImages();
                if (editorImageInput) editorImageInput.value = "";
                void discardPendingEditorUploads();
            }
            editorBuyer = nextBuyer;
            lastBuyer = editorBuyer;
            if (editingUid && !editorForceNew) {
                editingUid = null;
            }
            buyerBtns.forEach(x => {
                const on = (x.dataset.buyer || "上田") === editorBuyer;
                x.classList.toggle("active", on);
                x.setAttribute("aria-pressed", on ? "true" : "false");
            });
            loadEditorState();
        }

        function openEditor(d, options = {}) {
            const { buyer, uid, forceNew = false } = options;
            clearPendingEditorImages();
            if (editorImageInput) editorImageInput.value = "";
            editorUploadedImageIds = new Set();
            editorDate = d;
            editorForceNew = !!forceNew;
            editingUid = uid ?? null;
            if (buyer) editorBuyer = buyer;
            if (!editorBuyer) editorBuyer = lastBuyer || "上田";
            if (editingUid != null) {
                const row = rows.find(r => String(r.uid) === String(editingUid));
                if (row && row.buyer) editorBuyer = row.buyer;
            }
            buyerBtns.forEach(x => x.classList.toggle("active", (x.dataset.buyer || "上田") === editorBuyer));
            loadEditorState();
            if (editorOverlay) {
                editorOverlay.classList.add("show");
                editorOverlay.setAttribute("aria-hidden", "false");
            }
            document.body.classList.add("editor-open");
        }

        async function closeEditor({ discardUploads = true, force = false } = {}) {
            if (!force && (imageUploadInProgress || editorSaveInProgress)) {
                showToast(imageUploadInProgress ? "画像処理中です" : "保存中です");
                return;
            }
            if (discardUploads) await discardPendingEditorUploads();
            editorImageDraft = [];
            clearPendingEditorImages();
            clearEditorImagePreviews();
            if (editorImageInput) editorImageInput.value = "";
            renderEditorImages();
            if (editorOverlay) {
                editorOverlay.classList.remove("show");
                editorOverlay.setAttribute("aria-hidden", "true");
            }
            document.body.classList.remove("editor-open");
        }

        function loadEditorState() {
            clearPendingEditorImages();
            clearEditorImagePreviews();
            if (editorImageInput) editorImageInput.value = "";
            const row = editingUid != null
                ? rows.find(r => String(r.uid) === String(editingUid))
                : (editorForceNew ? null : rows.find(r => r.date === editorDate && (r.buyer || "上田") === editorBuyer));
            editingUid = row ? row.uid : null;

            if (editorInvest) editorInvest.value = row && row.amount != null && row.amount !== 0 ? String(row.amount).replace(/[^\d]/g, "") : "";
            if (editorRecover) editorRecover.value = row && row.payout != null && row.payout !== 0 ? String(row.payout).replace(/[^\d]/g, "") : "";
            editorImageDraft = normalizeTicketImages(row && row.images);
            if (editorImageStatus) editorImageStatus.textContent = "";
            renderEditorImages();

            const isEdit = !!row;
            if (editorTitle) editorTitle.textContent = formatEditorTitle(editorDate, isEdit);
            if (editorDelete) editorDelete.style.display = isEdit ? "block" : "none";

            updateEditorProfit();
        }

        function renderEditorImages() {
            if (!editorImageList) return;
            const savedImages = editorImageDraft.map((image, index) => {
                const previewUrl = editorImagePreviewUrls.get(image.id) || dayImagePreviewUrls.get(image.id);
                return `
                    <div class="ticket-image-item is-saved">
                        <button class="ticket-image-preview" type="button" data-image-action="view" data-image-index="${index}" aria-label="買い目画像を表示">
                            <img class="ticket-image-thumbnail" data-editor-image-id="${escapeHtml(image.id)}" alt="" loading="lazy"${previewUrl ? ` src="${escapeHtml(previewUrl)}"` : ""}>
                        </button>
                        <button class="ticket-image-remove" type="button" aria-label="保存済みの画像を削除" data-image-action="remove" data-image-index="${index}"><svg class="ticket-image-remove-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 17 17M17 7 7 17" /></svg></button>
                    </div>
                `;
            });
            const pendingImages = editorPendingImageFiles.map((pending, index) => `
                <div class="ticket-image-item is-pending">
                    <img class="ticket-image-thumbnail" src="${escapeHtml(pending.previewUrl)}" alt="">
                    <button class="ticket-image-remove" type="button" aria-label="選択した画像を削除" data-image-action="remove-pending" data-image-index="${index}"><svg class="ticket-image-remove-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 17 17M17 7 7 17" /></svg></button>
                </div>
            `);
            editorImageList.innerHTML = [...savedImages, ...pendingImages].join("");
            const generation = editorImagePreviewGeneration;
            editorImageList.querySelectorAll("img[data-editor-image-id]:not([src])").forEach(image => {
                void loadEditorImagePreview(image, generation);
            });
        }

        function clearEditorImagePreviews() {
            editorImagePreviewGeneration++;
            editorImagePreviewUrls.forEach(url => URL.revokeObjectURL(url));
            editorImagePreviewUrls.clear();
            editorImagePreviewRequests.clear();
            editorImagePreviewErrorGeneration = -1;
        }

        async function loadEditorImagePreview(imageElement, generation) {
            if (generation !== editorImagePreviewGeneration) return;
            const imageId = imageElement.dataset.editorImageId;
            if (!imageId) return;

            const cachedUrl = editorImagePreviewUrls.get(imageId) || dayImagePreviewUrls.get(imageId);
            if (cachedUrl) {
                imageElement.src = cachedUrl;
                return;
            }

            let request = editorImagePreviewRequests.get(imageId);
            if (!request) {
                request = (async () => {
                    const response = await imageApiRequest(`/images/${encodeURIComponent(imageId)}`);
                    const blob = await response.blob();
                    if (generation !== editorImagePreviewGeneration) return "";
                    const url = URL.createObjectURL(blob);
                    editorImagePreviewUrls.set(imageId, url);
                    return url;
                })();
                editorImagePreviewRequests.set(imageId, request);
            }

            try {
                const url = await request;
                if (!url || generation !== editorImagePreviewGeneration) return;
                editorImageList.querySelectorAll("img[data-editor-image-id]").forEach(image => {
                    if (image.dataset.editorImageId === imageId) image.src = url;
                });
            } catch (error) {
                if (generation === editorImagePreviewGeneration) {
                    editorImageList.querySelectorAll("img[data-editor-image-id]").forEach(image => {
                        if (image.dataset.editorImageId === imageId) image.classList.add("is-error");
                    });
                    if (editorImagePreviewErrorGeneration !== generation) {
                        editorImagePreviewErrorGeneration = generation;
                        showToast(imageErrorMessage(error), { type: "error" });
                    }
                }
            } finally {
                if (generation === editorImagePreviewGeneration) editorImagePreviewRequests.delete(imageId);
            }
        }

        function clearPendingEditorImages() {
            for (const pending of editorPendingImageFiles) {
                if (pending.previewUrl) URL.revokeObjectURL(pending.previewUrl);
            }
            editorPendingImageFiles = [];
        }

        function queueEditorImages() {
            const files = Array.from(editorImageInput?.files || []);
            if (editorImageInput) editorImageInput.value = "";
            if (!files.length || imageUploadInProgress || editorSaveInProgress) return;

            let added = 0;
            for (const file of files) {
                const extension = file.name.split(".").pop().toLowerCase();
                const supportedByExtension = ["avif", "bmp", "gif", "heic", "heif", "jpeg", "jpg", "png", "tif", "tiff", "webp"].includes(extension);
                if ((!file.type.startsWith("image/") && !supportedByExtension) || file.type === "image/svg+xml") {
                    showToast("非対応画像形式");
                    continue;
                }
                editorPendingImageFiles.push({ file, previewUrl: URL.createObjectURL(file) });
                added++;
            }
            if (editorImageStatus && added) editorImageStatus.textContent = "";
            renderEditorImages();
        }

        async function uploadEditorImages() {
            if (!editorPendingImageFiles.length) return true;

            imageUploadInProgress = true;
            if (editorImageInput) editorImageInput.disabled = true;
            if (editorImageStatus) editorImageStatus.textContent = "アップロードを準備しています…";
            let completed = 0;
            const total = editorPendingImageFiles.length;

            try {
                while (editorPendingImageFiles.length) {
                    const pending = editorPendingImageFiles[0];
                    const file = pending.file;
                    if (editorImageStatus) editorImageStatus.textContent = `アップロード中 ${completed + 1}/${total}`;

                    const response = await imageApiRequest("/images/upload", {
                        method: "POST",
                        headers: {
                            "Content-Type": file.type || "application/octet-stream",
                            "X-File-Name": encodeURIComponent(file.name)
                        },
                        body: file
                    });
                    const data = await response.json();
                    if (!isValidTicketImageId(data?.id)) throw new Error("画像登録失敗");

                    const image = {
                        id: String(data.id),
                        name: file.name || "買い目画像",
                        type: String(data.type || file.type || "image/jpeg")
                    };
                    editorImageDraft.push(image);
                    editorUploadedImageIds.add(image.id);
                    editorPendingImageFiles.shift();
                    if (pending.previewUrl) URL.revokeObjectURL(pending.previewUrl);
                    completed++;
                    renderEditorImages();
                }
                if (editorImageStatus) editorImageStatus.textContent = completed ? "画像をアップロードしました。記録を保存しています…" : "";
                return true;
            } catch (error) {
                if (editorImageStatus) {
                    editorImageStatus.textContent = editorPendingImageFiles.length
                        ? `${editorPendingImageFiles.length}枚の画像が未アップロードです。保存を再試行できます`
                        : "";
                }
                showToast(imageErrorMessage(error), { type: "error" });
                return false;
            } finally {
                imageUploadInProgress = false;
                if (editorImageInput) editorImageInput.disabled = editorSaveInProgress;
            }
        }

        function handleEditorImageListClick(event) {
            const button = event.target.closest("[data-image-action]");
            if (!button) return;
            const index = Number(button.dataset.imageIndex);
            if (button.dataset.imageAction === "remove-pending") {
                const [removed] = editorPendingImageFiles.splice(index, 1);
                if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
                if (editorImageStatus) editorImageStatus.textContent = "";
                renderEditorImages();
                return;
            }
            const image = editorImageDraft[index];
            if (!image) return;

            if (button.dataset.imageAction === "view") {
                openTicketImageViewer(editorImageDraft, index);
            } else if (button.dataset.imageAction === "remove") {
                editorImageDraft.splice(index, 1);
                renderEditorImages();
            }
        }

        async function discardPendingEditorUploads() {
            const ids = Array.from(editorUploadedImageIds);
            editorUploadedImageIds.clear();
            if (!ids.length) return;
            const results = await Promise.allSettled(ids.map(id => imageApiRequest(`/images/${encodeURIComponent(id)}`, { method: "DELETE" })));
            if (results.some(result => result.status === "rejected")) {
                showToast("画像削除失敗", { type: "error" });
            }
        }

        async function deleteStoredImages(images) {
            const ids = Array.from(new Set(normalizeTicketImages(images).map(image => image.id)));
            if (!ids.length) return true;
            const results = await Promise.allSettled(ids.map(id => imageApiRequest(`/images/${encodeURIComponent(id)}`, { method: "DELETE" })));
            const ok = results.every(result => result.status === "fulfilled");
            if (!ok) showToast("記録保存済・画像削除失敗", { type: "error" });
            return ok;
        }

        function openTicketImageViewer(images, startIndex = 0) {
            viewerImages = normalizeTicketImages(images);
            if (!viewerImages.length) {
                showToast("画像なし");
                return;
            }
            viewerImageIndex = Math.max(0, Math.min(startIndex, viewerImages.length - 1));
            resetViewerImageTransform();
            ticketImageViewer.classList.add("show");
            ticketImageViewer.setAttribute("aria-hidden", "false");
            void renderViewerImage();
        }

        async function renderViewerImage() {
            const token = ++viewerLoadToken;
            const image = viewerImages[viewerImageIndex];
            if (!image) return;
            resetViewerImageTransform();
            if (viewerImageObjectUrl) URL.revokeObjectURL(viewerImageObjectUrl);
            viewerImageObjectUrl = "";
            ticketImageViewerImage.removeAttribute("src");

            const previewUrl = dayImagePreviewUrls.get(image.id);
            if (previewUrl) {
                ticketImageViewerImage.src = previewUrl;
                ticketImageViewerImage.alt = image.name;
                return;
            }

            try {
                const response = await imageApiRequest(`/images/${encodeURIComponent(image.id)}`);
                const blob = await response.blob();
                if (token !== viewerLoadToken) return;
                viewerImageObjectUrl = URL.createObjectURL(blob);
                ticketImageViewerImage.src = viewerImageObjectUrl;
                ticketImageViewerImage.alt = image.name;
            } catch (error) {
                if (token === viewerLoadToken) showToast(imageErrorMessage(error), { type: "error" });
            }
        }

        function moveViewerImage(delta) {
            if (!viewerImages.length) return;
            viewerImageIndex = (viewerImageIndex + delta + viewerImages.length) % viewerImages.length;
            void renderViewerImage();
        }

        function resetViewerImageTransform() {
            viewerImageScale = 1;
            viewerImageOffsetX = 0;
            viewerImageOffsetY = 0;
            viewerMousePan = null;
            viewerTouchStartedOnImage = false;
            viewerTouchGesture = null;
            ticketImageViewerImage.style.transform = "";
            ticketImageViewer.classList.remove("is-zoomed", "is-panning");
        }

        function constrainViewerImageOffsets(offsetX, offsetY, scale = viewerImageScale) {
            const maxOffsetX = Math.max(0, (ticketImageViewerImage.offsetWidth * scale - ticketImageViewerImageViewport.clientWidth) / 2);
            const maxOffsetY = Math.max(0, (ticketImageViewerImage.offsetHeight * scale - ticketImageViewerImageViewport.clientHeight) / 2);
            return {
                x: Math.max(-maxOffsetX, Math.min(maxOffsetX, offsetX)),
                y: Math.max(-maxOffsetY, Math.min(maxOffsetY, offsetY))
            };
        }

        function applyViewerImageTransform() {
            if (viewerImageScale <= 1) {
                resetViewerImageTransform();
                return;
            }
            const offsets = constrainViewerImageOffsets(viewerImageOffsetX, viewerImageOffsetY);
            viewerImageOffsetX = offsets.x;
            viewerImageOffsetY = offsets.y;
            ticketImageViewerImage.style.transform = `translate3d(${viewerImageOffsetX}px, ${viewerImageOffsetY}px, 0) scale(${viewerImageScale})`;
            ticketImageViewer.classList.add("is-zoomed");
        }

        function clampViewerImageScale(scale) {
            return Math.max(1, Math.min(4, scale));
        }

        function zoomViewerImageAt(scale, clientX, clientY) {
            const imageWidth = ticketImageViewerImage.offsetWidth;
            const imageHeight = ticketImageViewerImage.offsetHeight;
            if (!imageWidth || !imageHeight) return;

            const nextScale = clampViewerImageScale(scale);
            if (nextScale <= 1) {
                resetViewerImageTransform();
                return;
            }

            const rect = ticketImageViewerImage.getBoundingClientRect();
            const baseCenterX = rect.left - viewerImageOffsetX + imageWidth * viewerImageScale / 2;
            const baseCenterY = rect.top - viewerImageOffsetY + imageHeight * viewerImageScale / 2;
            const imagePointX = (clientX - baseCenterX - viewerImageOffsetX) / viewerImageScale;
            const imagePointY = (clientY - baseCenterY - viewerImageOffsetY) / viewerImageScale;

            viewerImageOffsetX = clientX - baseCenterX - imagePointX * nextScale;
            viewerImageOffsetY = clientY - baseCenterY - imagePointY * nextScale;
            viewerImageScale = nextScale;
            applyViewerImageTransform();
        }

        function handleViewerMousePanStart(event) {
            if (!ticketImageViewer.classList.contains("show") || viewerImageScale <= 1) return;
            if (event.pointerType !== "mouse" || event.button !== 0) return;
            viewerMousePan = {
                pointerId: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                offsetX: viewerImageOffsetX,
                offsetY: viewerImageOffsetY
            };
            ticketImageViewer.classList.add("is-panning");
            ticketImageViewerImage.setPointerCapture(event.pointerId);
            event.preventDefault();
        }

        function handleViewerMousePanMove(event) {
            if (!viewerMousePan || event.pointerId !== viewerMousePan.pointerId) return;
            viewerImageOffsetX = viewerMousePan.offsetX + event.clientX - viewerMousePan.startX;
            viewerImageOffsetY = viewerMousePan.offsetY + event.clientY - viewerMousePan.startY;
            applyViewerImageTransform();
            event.preventDefault();
        }

        function handleViewerMousePanEnd(event) {
            if (!viewerMousePan || (event.pointerId != null && event.pointerId !== viewerMousePan.pointerId)) return;
            viewerMousePan = null;
            ticketImageViewer.classList.remove("is-panning");
        }

        function viewerTouchMidpoint(first, second) {
            return {
                x: (first.clientX + second.clientX) / 2,
                y: (first.clientY + second.clientY) / 2
            };
        }

        function startViewerPinch(touches) {
            if (touches.length < 2) return;
            const first = touches[0];
            const second = touches[1];
            const midpoint = viewerTouchMidpoint(first, second);
            const dx = second.clientX - first.clientX;
            const dy = second.clientY - first.clientY;
            const imageWidth = ticketImageViewerImage.offsetWidth;
            const imageHeight = ticketImageViewerImage.offsetHeight;
            if (!imageWidth || !imageHeight) return;

            const rect = ticketImageViewerImage.getBoundingClientRect();
            const baseCenterX = rect.left - viewerImageOffsetX + imageWidth * viewerImageScale / 2;
            const baseCenterY = rect.top - viewerImageOffsetY + imageHeight * viewerImageScale / 2;
            viewerTouchGesture = {
                type: "pinch",
                startDistance: Math.max(1, Math.hypot(dx, dy)),
                startScale: viewerImageScale,
                baseCenterX,
                baseCenterY,
                imagePointX: (midpoint.x - baseCenterX - viewerImageOffsetX) / viewerImageScale,
                imagePointY: (midpoint.y - baseCenterY - viewerImageOffsetY) / viewerImageScale
            };
        }

        function startViewerPan(touch) {
            viewerTouchGesture = {
                type: "pan",
                startX: touch.clientX,
                startY: touch.clientY,
                offsetX: viewerImageOffsetX,
                offsetY: viewerImageOffsetY
            };
        }

        function handleViewerWheel(event) {
            if (!ticketImageViewer.classList.contains("show")) return;
            const desktopPointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
            if (desktopPointer && event.target === ticketImageViewerImage) {
                const wheelDelta = event.deltaMode === WheelEvent.DOM_DELTA_LINE
                    ? event.deltaY * 16
                    : event.deltaMode === WheelEvent.DOM_DELTA_PAGE
                        ? event.deltaY * window.innerHeight
                        : event.deltaY;
                zoomViewerImageAt(viewerImageScale * Math.exp(-wheelDelta * 0.002), event.clientX, event.clientY);
            }
            event.preventDefault();
        }

        function handleViewerTouchStart(event) {
            if (!ticketImageViewer.classList.contains("show")) return;
            if (event.target === ticketImageViewerImage) viewerTouchStartedOnImage = true;
            if (!viewerTouchStartedOnImage) return;

            if (event.touches.length >= 2) {
                startViewerPinch(event.touches);
            } else if (event.touches.length === 1 && viewerImageScale > 1) {
                startViewerPan(event.touches[0]);
            }
        }

        function handleViewerTouchMove(event) {
            if (!ticketImageViewer.classList.contains("show")) return;
            if (viewerTouchStartedOnImage && event.touches.length >= 2) {
                if (viewerTouchGesture?.type !== "pinch") {
                    startViewerPinch(event.touches);
                } else {
                    const first = event.touches[0];
                    const second = event.touches[1];
                    const midpoint = viewerTouchMidpoint(first, second);
                    const distance = Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY);
                    const nextScale = clampViewerImageScale(viewerTouchGesture.startScale * distance / viewerTouchGesture.startDistance);
                    if (nextScale <= 1) {
                        viewerImageScale = 1;
                        viewerImageOffsetX = 0;
                        viewerImageOffsetY = 0;
                        ticketImageViewerImage.style.transform = "";
                        ticketImageViewer.classList.remove("is-zoomed");
                    } else {
                        viewerImageScale = nextScale;
                        viewerImageOffsetX = midpoint.x - viewerTouchGesture.baseCenterX - viewerTouchGesture.imagePointX * nextScale;
                        viewerImageOffsetY = midpoint.y - viewerTouchGesture.baseCenterY - viewerTouchGesture.imagePointY * nextScale;
                        applyViewerImageTransform();
                    }
                }
            } else if (viewerTouchStartedOnImage && event.touches.length === 1 && viewerImageScale > 1) {
                const touch = event.touches[0];
                if (viewerTouchGesture?.type !== "pan") startViewerPan(touch);
                if (viewerTouchGesture?.type === "pan") {
                    viewerImageOffsetX = viewerTouchGesture.offsetX + touch.clientX - viewerTouchGesture.startX;
                    viewerImageOffsetY = viewerTouchGesture.offsetY + touch.clientY - viewerTouchGesture.startY;
                    applyViewerImageTransform();
                }
            }
            event.preventDefault();
        }

        function handleViewerTouchEnd(event) {
            if (!viewerTouchStartedOnImage) return;
            if (event.touches.length >= 2) {
                startViewerPinch(event.touches);
            } else if (event.touches.length === 1) {
                if (viewerImageScale > 1) startViewerPan(event.touches[0]);
                else viewerTouchGesture = null;
            } else {
                viewerTouchStartedOnImage = false;
                viewerTouchGesture = null;
            }
        }

        function handleViewerTouchCancel() {
            viewerTouchStartedOnImage = false;
            viewerTouchGesture = null;
        }

        function closeTicketImageViewer() {
            viewerLoadToken++;
            resetViewerImageTransform();
            ticketImageViewer.classList.remove("show");
            ticketImageViewer.setAttribute("aria-hidden", "true");
            ticketImageViewerImage.removeAttribute("src");
            if (viewerImageObjectUrl) URL.revokeObjectURL(viewerImageObjectUrl);
            viewerImageObjectUrl = "";
            viewerImages = [];
        }

        function updateEditorProfit() {
            const a = editorInvest ? Number(editorInvest.value) || 0 : 0;
            const p = editorRecover ? Number(editorRecover.value) || 0 : 0;
            const diff = p - a;

            if (!editorProfit) return;
            editorProfit.textContent = formatYen(diff);
            editorProfit.classList.remove("pos", "neg");
            if (diff > 0) editorProfit.classList.add("pos");
            if (diff < 0) editorProfit.classList.add("neg");
        }

        async function saveEditor() {
            if (!editorDate) return;
            if (imageUploadInProgress || editorSaveInProgress) {
                showToast(imageUploadInProgress ? "画像処理中です" : "保存中です");
                return;
            }
            editorSaveInProgress = true;
            if (editorImageInput) editorImageInput.disabled = true;

            try {
                if (!(await uploadEditorImages())) return;

                const a = editorInvest ? Number(editorInvest.value) || 0 : 0;
                const p = editorRecover ? Number(editorRecover.value) || 0 : 0;

                const existing = editingUid != null
                    ? rows.find(r => String(r.uid) === String(editingUid))
                    : (editorForceNew ? null : rows.find(r => r.date === editorDate && (r.buyer || "上田") === editorBuyer));
                const previousImages = normalizeTicketImages(existing && existing.images);
                let savedRow = existing;
                if (existing) {
                    existing.amount = a ? String(a) : "";
                    existing.payout = p ? String(p) : "";
                    existing.buyer = editorBuyer || "上田";
                    existing.images = normalizeTicketImages(editorImageDraft);
                } else {
                    savedRow = {
                        uid: uidSeq++,
                        date: editorDate,
                        amount: a ? String(a) : "",
                        payout: p ? String(p) : "",
                        buyer: editorBuyer || "上田",
                        images: normalizeTicketImages(editorImageDraft)
                    };
                    rows.push(savedRow);
                }
                editingUid = savedRow.uid;
                editorForceNew = false;

                calc();
                renderCalendar();


                rebuildYearOptions();
                applyYearFilter();

                const ok = await saveData();
                if (ok) {
                    const savedImageIds = new Set(normalizeTicketImages(savedRow.images).map(image => image.id));
                    const removedImages = [
                        ...previousImages,
                        ...Array.from(editorUploadedImageIds, id => ({ id }))
                    ].filter(image => !savedImageIds.has(image.id));
                    editorUploadedImageIds.clear();
                    await deleteStoredImages(removedImages);
                    await closeEditor({ discardUploads: false, force: true });
                } else if (savedRow) {
                    savedRow.images = previousImages;
                    if (editorImageStatus && editorUploadedImageIds.size) {
                        editorImageStatus.textContent = "画像はアップロード済みです。記録の保存を再試行してください";
                    }
                    calc();
                    renderCalendar();
                }
            } finally {
                editorSaveInProgress = false;
                if (editorImageInput) editorImageInput.disabled = false;
            }
        }

        async function deleteEditor() {
            if (imageUploadInProgress || editorSaveInProgress) {
                showToast(imageUploadInProgress ? "画像処理中です" : "保存中です");
                return;
            }
            const row = editingUid != null
                ? rows.find(r => String(r.uid) === String(editingUid))
                : rows.find(r => r.date === editorDate && (r.buyer || "上田") === editorBuyer);
            if (!row) return;
            const imagesToDelete = [
                ...normalizeTicketImages(row.images),
                ...Array.from(editorUploadedImageIds, id => ({ id }))
            ];

            const originalIndex = rows.indexOf(row);
            rows = rows.filter(x => x.uid !== row.uid);

            calc();
            renderCalendar();


            rebuildYearOptions();
            applyYearFilter();

            const ok = await saveData({ message: "削除しました" });
            if (ok) {
                editorUploadedImageIds.clear();
                await deleteStoredImages(imagesToDelete);
                await closeEditor({ discardUploads: false });
            } else {
                rows.splice(Math.max(0, originalIndex), 0, row);
                editingUid = row.uid;
                calc();
                renderCalendar();
            }
        }

        function openEditorFromFab() {
            const today = todayJST();
            const d = selectedDate || (ymFromDate(today) === viewMonth ? today : (viewMonth ? `${viewMonth}-01` : today));
            selectedDate = d;
            ensureSelectedInMonth();
            renderCalendar();
            openEditor(d, { forceNew: true });
        }

        function addRow() {
            const today = todayJST();
            const d = selectedDate || (ymFromDate(today) === viewMonth ? today : (viewMonth ? `${viewMonth}-01` : today));
            selectedDate = d;
            ensureSelectedInMonth();
            renderCalendar();
            openEditor(d, { forceNew: true });
        }

        function removeRow(uid) {
            rows = rows.filter(r => String(r.uid) !== String(uid));
            renderAll();
        }

        async function loadData() {
            try {
                const res = await dataApiRequest();
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                uidSeq = 1;
                rows = (Array.isArray(data) ? data : []).map(r => ({
                    uid: uidSeq++,
                    date: normalizeRecordDate(r.date),
                    amount: r.amount ?? "",
                    payout: r.payout ?? "",
                    buyer: r.buyer || "上田",
                    images: normalizeTicketImages(r.images)
                }));

                rebuildYearOptions();

                const today = todayJST();
                const todayYm = today.slice(0, 7);
                selectedDate = today;
                setViewMonth(todayYm);

                applyYearFilter();
            } catch (e) {
                showToast(e?.message === "アクセスキー不正" ? "アクセスキー不正" : "読み込みに失敗しました");
                const todayYm = todayJST().slice(0, 7);
                setViewMonth(todayYm);
            }
        }

        async function saveData({ message = "保存しました" } = {}) {
            const payload = rows.map(r => {
                const images = normalizeTicketImages(r.images);
                return {
                    date: r.date,
                    amount: Number(r.amount) || 0,
                    payout: Number(r.payout) || 0,
                    buyer: r.buyer || "上田",
                    ...(images.length ? { images } : {})
                };
            });

            try {
                const res = await dataApiRequest({
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                showToast(message);
                return true;
            } catch (e) {
                showToast(e?.message === "アクセスキー不正" ? "アクセスキー不正" : "保存に失敗しました");
                return false;
            }
        }

        calGrid.addEventListener("click", e => {
            const cell = e.target.closest(".cal-cell");
            if (!cell || cell.classList.contains("outside")) return;
            const d = cell.dataset.date;
            if (!d) return;
            selectedDate = d;
            renderCalendar();
            updateDaySummary();
        });

        daySummaryList.addEventListener("click", e => {
            const imageButton = e.target.closest(".day-entry-image-thumb");
            if (imageButton) {
                const imageRow = rows.find(r => String(r.uid) === String(imageButton.dataset.uid));
                if (imageRow) openTicketImageViewer(imageRow.images, Number(imageButton.dataset.imageIndex) || 0);
                return;
            }

            const entry = e.target.closest(".day-summary-entry");
            if (!entry) return;
            const uid = entry.dataset.uid;
            const row = rows.find(r => String(r.uid) === String(uid));
            if (!row) return;
            selectedDate = row.date;
            ensureSelectedInMonth();
            renderCalendar();
            openEditor(row.date, { uid: row.uid, buyer: row.buyer, forceNew: false });
        });

        dayList.addEventListener("focusin", e => {
            const t = e.target;
            if (t && (t.classList.contains("entry-amount") || t.classList.contains("entry-payout"))) startEdit(t);
        });

        dayList.addEventListener("input", e => {
            const t = e.target;
            const rowEl = t && t.closest(".entry-row");
            if (!t || !rowEl) return;

            const uid = rowEl.dataset.uid;
            const r = rows.find(x => String(x.uid) === String(uid));
            if (!r) return;

            if (t.classList.contains("entry-amount")) {
                sanitizeNumberInput(t);
                r.amount = t.value ? parseYen(t.value) : "";
                calc();
                renderCalendar();
                return;
            }

            if (t.classList.contains("entry-payout")) {
                sanitizeNumberInput(t);
                r.payout = t.value ? parseYen(t.value) : "";
                calc();
                renderCalendar();
                return;
            }
        });

        dayList.addEventListener("focusout", e => {
            const t = e.target;
            if (!t) return;
            if (t.classList.contains("entry-amount") || t.classList.contains("entry-payout")) endEdit(t);
        });

        dayList.addEventListener("change", e => {
            const t = e.target;
            const rowEl = t && t.closest(".entry-row");
            if (!t || !rowEl) return;

            const uid = rowEl.dataset.uid;
            const r = rows.find(x => String(x.uid) === String(uid));
            if (!r) return;

            if (t.classList.contains("entry-date")) {
                r.date = t.value || r.date;
                selectedDate = r.date;
                ensureSelectedInMonth();
                renderAll();
                return;
            }

            if (t.classList.contains("entry-buyer")) {
                r.buyer = t.value;
                calc();
                renderCalendar();
                return;
            }
        });

        dayList.addEventListener("click", e => {
            const btn = e.target.closest(".entry-delete");
            if (!btn) return;
            if (!document.body.classList.contains("delete-mode")) return;
            const rowEl = btn.closest(".entry-row");
            if (!rowEl) return;
            removeRow(rowEl.dataset.uid);
        });

        monthPicker.addEventListener("change", () => {
            if (!monthPicker.value) return;
            setViewMonth(monthPicker.value);
        });

        if (yearFilter) yearFilter.addEventListener("change", () => applyYearFilter());
        setDeleteMode(false);
        loadData();
    </script>

</body>

</html>
