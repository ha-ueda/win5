    <script>
        const API_URL = "https://shushi.cooopew.workers.dev/";
        const IMAGE_API_URL = "https://shushi-images.cooopew.workers.dev";
        const IMAGE_TOKEN_STORAGE_KEY = "shushi_image_api_token";

        let rows = [];
        let uidSeq = 1;
        let editorImageDraft = [];
        let editorPendingImageFiles = [];
        let editorUploadedImageIds = new Set();
        let imageUploadInProgress = false;
        let editorSaveInProgress = false;
        let viewerImages = [];
        let viewerImageIndex = 0;
        let viewerImageObjectUrl = "";
        let viewerLoadToken = 0;

        const calGrid = document.getElementById("calGrid");
        const monthTitle = document.getElementById("monthTitle");
        const monthPicker = document.getElementById("monthPicker");
        const dayTitle = document.getElementById("dayTitle");
        const dayList = document.getElementById("dayList");
        const dayEmpty = document.getElementById("dayEmpty");
        const daySummaryDate = document.getElementById("daySummaryDate");
        const daySummaryList = document.getElementById("daySummaryList");
        const editorOverlay = document.getElementById("editorOverlay");
        const editorTitle = document.getElementById("editorTitle");
        const editorInvest = document.getElementById("editorInvest");
        const editorRecover = document.getElementById("editorRecover");
        const editorProfit = document.getElementById("editorProfit");
        const editorDelete = document.getElementById("editorDelete");
        const editorImageInput = document.getElementById("editorImageInput");
        const editorImageStatus = document.getElementById("editorImageStatus");
        const editorImageList = document.getElementById("editorImageList");
        const ticketImageViewer = document.getElementById("ticketImageViewer");
        const ticketImageViewerTitle = document.getElementById("ticketImageViewerTitle");
        const ticketImageViewerImage = document.getElementById("ticketImageViewerImage");
        const buyerBtns = Array.from(document.querySelectorAll(".buyer-btn"));
        const fabEdit = document.getElementById("fabEdit");
        const yearFilter = document.getElementById("yearFilter");
        let editorDate = "";
        let editorBuyer = "上田";
        let editingUid = null;
        let editorForceNew = false;
        let lastBuyer = "上田";

        if (editorInvest) editorInvest.addEventListener("input", () => { sanitizeNumberInput(editorInvest); updateEditorProfit(); });
        if (editorRecover) editorRecover.addEventListener("input", () => { sanitizeNumberInput(editorRecover); updateEditorProfit(); });

        buyerBtns.forEach(btn => {
            btn.addEventListener("click", () => setEditorBuyer(btn.dataset.buyer || "上田"));
        });

        if (editorImageInput) editorImageInput.addEventListener("change", queueEditorImages);
        if (editorImageList) editorImageList.addEventListener("click", handleEditorImageListClick);
        document.getElementById("ticketImageViewerClose").addEventListener("click", closeTicketImageViewer);
        document.getElementById("ticketImageViewerPrev").addEventListener("click", () => moveViewerImage(-1));
        document.getElementById("ticketImageViewerNext").addEventListener("click", () => moveViewerImage(1));
        ticketImageViewer.addEventListener("click", e => {
            if (e.target === ticketImageViewer) closeTicketImageViewer();
        });
        document.addEventListener("keydown", e => {
            if (!ticketImageViewer.classList.contains("show")) return;
            if (e.key === "Escape") closeTicketImageViewer();
            if (e.key === "ArrowLeft") moveViewerImage(-1);
            if (e.key === "ArrowRight") moveViewerImage(1);
        });

        let viewMonth = "";
        let selectedDate = "";

        function todayJST() {
            return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
        }

        function pad2(n) { return String(n).padStart(2, "0"); }

        function ymFromDate(d) { return d && d.length >= 7 ? d.slice(0, 7) : ""; }

        function formatMonthTitle(ym) {
            const y = ym.slice(0, 4);
            const m = String(parseInt(ym.slice(5, 7), 10));
            return `${y}年${m}月`;
        }

        function formatDayLabel(d) {
            if (!d || d.length < 10) return "";
            const mm = Number(d.slice(5, 7));
            const dd = Number(d.slice(8, 10));
            if (!mm || !dd) return "";
            return `${mm}月${dd}日`;
        }

        function formatYen(n) {
            const num = Number(n);
            if (!isFinite(num) || num === 0) return "0円";
            if (num < 0) return "-" + Math.abs(num).toLocaleString() + "円";
            return num.toLocaleString() + "円";
        }

        function formatProfitSpan(n) {
            if (n > 0) return `<span class="profit">${formatYen(n)}</span>`;
            if (n < 0) return `<span class="loss">${formatYen(n)}</span>`;
            return `<span>0円</span>`;
        }

        function parseYen(s) {
            return Number(String(s || "").replace(/[円,]/g, "")) || 0;
        }

        function sanitizeNumberInput(el) {
            el.value = el.value.replace(/[^\d]/g, "");
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>"']/g, ch => {
                if (ch === "&") return "&amp;";
                if (ch === "<") return "&lt;";
                if (ch === ">") return "&gt;";
                if (ch === '"') return "&quot;";
                return "&#39;";
            });
        }

        function normalizeTicketImages(images) {
            if (!Array.isArray(images)) return [];
            return images
                .filter(image => image && /^[0-9a-f-]{36}$/i.test(String(image.id || "")))
                .map(image => ({
                    id: String(image.id),
                    name: String(image.name || "買い目画像"),
                    type: String(image.type || "image/jpeg")
                }));
        }

        function getImageApiToken() {
            let token = localStorage.getItem(IMAGE_TOKEN_STORAGE_KEY) || "";
            if (!token) {
                token = window.prompt("画像Workerに設定したアクセスキーを入力してください") || "";
                token = token.trim();
                if (token) localStorage.setItem(IMAGE_TOKEN_STORAGE_KEY, token);
            }
            if (!token) throw new Error("画像用アクセスキーが必要です");
            return token;
        }

        async function imageApiRequest(path, options = {}) {
            const token = getImageApiToken();
            const headers = new Headers(options.headers || {});
            headers.set("Authorization", `Bearer ${token}`);
            const response = await fetch(`${IMAGE_API_URL}${path}`, { ...options, headers });

            if (response.status === 401) {
                localStorage.removeItem(IMAGE_TOKEN_STORAGE_KEY);
                throw new Error("画像用アクセスキーが正しくありません。もう一度お試しください");
            }

            if (!response.ok) {
                let message = "画像の処理に失敗しました";
                try {
                    const data = await response.clone().json();
                    if (data && data.error === "image service is not configured") {
                        message = "画像WorkerのR2設定が完了していません";
                    } else if (data && data.error === "unsupported image type") {
                        message = "この画像形式には対応していません";
                    }
                } catch { }
                throw new Error(message);
            }
            return response;
        }

        function imageErrorMessage(error) {
            if (error instanceof TypeError) return "画像Workerに接続できません。URLとデプロイ状態を確認してください";
            return error?.message || "画像の処理に失敗しました";
        }

        function startEdit(el) {
            const v = el.value ? String(parseYen(el.value)) : "";
            el.value = v === "0" ? "" : v;
            el.select();
        }

        function endEdit(el) {
            if (!el.value) return;
            const n = parseYen(el.value);
            el.value = n ? formatYen(n) : "";
        }

        let toastHideTimer = null;
        let toastFadeTimer = null;
        const LOADING_TIMEOUT = 30000;

        function showToast(message, { type = "info", duration = 2000 } = {}) {
            let el = document.querySelector(".ns-toast");
            if (toastHideTimer) { clearTimeout(toastHideTimer); toastHideTimer = null; }
            if (toastFadeTimer) { clearTimeout(toastFadeTimer); toastFadeTimer = null; }

            if (!el) {
                el = document.createElement("div");
                el.className = "ns-toast";
                document.body.appendChild(el);
            }

            el.setAttribute("role", type === "error" ? "alert" : "status");
            el.setAttribute("aria-live", type === "error" ? "assertive" : "polite");

            el.dataset.type = type;
            el.dataset.visible = "0";
            el.textContent = message;

            requestAnimationFrame(() => {
                el.dataset.visible = "1";
            });

            const effectiveDuration = type === "loading" ? LOADING_TIMEOUT : duration;
            toastHideTimer = setTimeout(() => {
                el.dataset.visible = "0";
                toastFadeTimer = setTimeout(() => el.remove(), 200);
            }, effectiveDuration);
        }

        function setDeleteMode(on) {
            const btn = document.getElementById("deleteModeBtn");
            if (!btn) return;
            if (on) {
                document.body.classList.add("delete-mode");
                btn.setAttribute("aria-pressed", "true");
            } else {
                document.body.classList.remove("delete-mode");
                btn.setAttribute("aria-pressed", "false");
            }
        }

        function toggleDeleteMode() {
            const on = !document.body.classList.contains("delete-mode");
            setDeleteMode(on);
        }

        function setViewMonth(ym) {
            viewMonth = ym;
            monthTitle.textContent = formatMonthTitle(ym);
            monthPicker.value = ym;

            if (!selectedDate || ymFromDate(selectedDate) !== ym) {
                const today = todayJST();
                selectedDate = ymFromDate(today) === ym ? today : `${ym}-01`;
            }

            renderAll();
        }

        function openMonthPicker() {
            monthPicker.click();
            monthPicker.focus();
        }

        function shiftMonth(delta) {
            const y = parseInt(viewMonth.slice(0, 4), 10);
            const m = parseInt(viewMonth.slice(5, 7), 10);
            const d = new Date(y, m - 1 + delta, 1);
            setViewMonth(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`);
        }

        function getRowsInMonth(ym) {
            return rows.filter(r => r.date && r.date.startsWith(ym));
        }

        function rebuildYearOptions() {
            if (!yearFilter) return;

            const years = Array.from(new Set(
                rows
                    .map(r => (r.date || "").slice(0, 4))
                    .filter(y => y && y.length === 4)
            )).sort((a, b) => Number(b) - Number(a));

            const saved = localStorage.getItem("shushi_year_filter") || "all";
            const current = yearFilter.value || saved || "all";

            yearFilter.innerHTML = `<option value="all">全期間</option>` + years.map(y => `<option value="${y}">${y}年</option>`).join("");
            yearFilter.value = (current !== "all" && years.includes(current)) ? current : "all";
        }

        function getYearFilterValue() {
            if (!yearFilter) return "all";
            return yearFilter.value || "all";
        }

        function fitYearFilterWidth() {
            if (!yearFilter) return;

            const opt = yearFilter.options[yearFilter.selectedIndex];
            const text = opt ? opt.text : "";

            let meas = document.getElementById("yearMeasure");
            if (!meas) {
                meas = document.createElement("span");
                meas.id = "yearMeasure";
                meas.style.position = "absolute";
                meas.style.visibility = "hidden";
                meas.style.whiteSpace = "pre";
                meas.style.pointerEvents = "none";
                document.body.appendChild(meas);
            }

            const cs = getComputedStyle(yearFilter);
            meas.style.font = cs.font;
            meas.style.fontWeight = cs.fontWeight;
            meas.textContent = text;

            const w = meas.getBoundingClientRect().width;
            yearFilter.style.width = Math.ceil(w + 2) + "px";
        }

        function applyYearFilter() {
            if (!yearFilter) {
                calc();
                return;
            }

            const y = getYearFilterValue();
            localStorage.setItem("shushi_year_filter", y);
            fitYearFilterWidth();
            calc();
        }

        function calc() {
            const yFilter = getYearFilterValue();
            const baseRows = (yFilter === "all") ? rows : rows.filter(r => (r.date || "").slice(0, 4) === yFilter);

            let sumUeda = 0, sumChiba = 0;
            let payUeda = 0, payChiba = 0;

            baseRows.forEach(r => {
                const amount = Number(r.amount) || 0;
                const payout = Number(r.payout) || 0;
                const buyer = r.buyer || "上田";

                if (buyer === "上田") {
                    sumUeda += amount;
                    payUeda += payout;
                } else {
                    sumChiba += amount;
                    payChiba += payout;
                }
            });

            const sumTotal = sumUeda + sumChiba;
            const sumPayout = payUeda + payChiba;
            const profit = sumPayout - sumTotal;

            const profitUeda = payUeda - sumUeda;
            const profitChiba = payChiba - sumChiba;

            const su = document.getElementById("sumUeda");
            if (su) su.innerHTML = `<span>${formatYen(sumUeda)}</span>`;
            const pueda = document.getElementById("payUeda");
            if (pueda) pueda.innerHTML = `<span>${formatYen(payUeda)}</span>`;
            const sc = document.getElementById("sumChiba");
            if (sc) sc.innerHTML = `<span>${formatYen(sumChiba)}</span>`;
            const pchiba = document.getElementById("payChiba");
            if (pchiba) pchiba.innerHTML = `<span>${formatYen(payChiba)}</span>`;
            const st = document.getElementById("sumTotal");
            if (st) st.innerHTML = `<span>${formatYen(sumTotal)}</span>`;
            const sp = document.getElementById("sumPayout");
            if (sp) sp.innerHTML = `<span>${formatYen(sumPayout)}</span>`;

            const pu = document.getElementById("profitUeda");
            if (pu) pu.innerHTML = formatProfitSpan(profitUeda);
            const pc = document.getElementById("profitChiba");
            if (pc) pc.innerHTML = formatProfitSpan(profitChiba);
            const pt = document.getElementById("profitTotal");
            if (pt) pt.innerHTML = formatProfitSpan(profit);

            const profitElem = document.getElementById("profit");
            if (profitElem) {
                if (profit > 0) profitElem.innerHTML = `<span class="profit">${formatYen(profit)}</span>`;
                else if (profit < 0) profitElem.innerHTML = `<span class="loss">${formatYen(profit)}</span>`;
                else profitElem.innerHTML = `<span>0円</span>`;
            }

            const monthRows = getRowsInMonth(viewMonth);
            let monthInvest = 0;
            let monthRecover = 0;

            monthRows.forEach(r => {
                monthInvest += Number(r.amount) || 0;
                monthRecover += Number(r.payout) || 0;
            });

            const monthProfit = monthRecover - monthInvest;

            const mp = document.getElementById("monthProfit");
            const mi = document.getElementById("monthInvest");
            const mr = document.getElementById("monthRecover");

            if (mp) {
                mp.textContent = formatYen(monthProfit);
                mp.classList.toggle("loss", monthProfit < 0);
                mp.classList.toggle("profit", monthProfit > 0);
                if (monthProfit === 0) { mp.classList.remove("loss"); mp.classList.remove("profit"); }
            }
            if (mi) mi.textContent = formatYen(monthInvest);
            if (mr) mr.textContent = formatYen(monthRecover);

            updateDaySummary();
        }

        function updateDaySummary() {
            if (!daySummaryDate || !daySummaryList) return;
            if (!selectedDate) {
                daySummaryDate.textContent = "";
                daySummaryList.innerHTML = "";
                return;
            }

            const dayRows = rows
                .filter(r => r.date === selectedDate)
                .sort((a, b) => (a.uid || 0) - (b.uid || 0));

            daySummaryDate.textContent = formatDayLabel(selectedDate);

            if (dayRows.length === 0) {
                daySummaryList.innerHTML = "";
                return;
            }

            daySummaryList.innerHTML = dayRows.map(r => {
                const invest = Number(r.amount) || 0;
                const recover = Number(r.payout) || 0;
                const profit = recover - invest;
                const buyer = r.buyer || "上田";
                const images = normalizeTicketImages(r.images);
                const profitClass = profit > 0 ? "profit" : (profit < 0 ? "loss" : "");
                return `
                    <div class="day-summary-entry" data-uid="${r.uid}">
                        <div class="day-entry-profit ${profitClass}">${formatYen(profit)}</div>
                        <div class="day-entry-side">
                            <div class="ms-row">
                                <div>購入</div>
                                <div class="ms-val">${formatYen(invest)}</div>
                            </div>
                            <div class="ms-row">
                                <div>払戻</div>
                                <div class="ms-val">${formatYen(recover)}</div>
                            </div>
                            <div class="ms-row">
                                <div>買主</div>
                                <div class="ms-val">${escapeHtml(buyer)}</div>
                            </div>
                            ${images.length ? `<button class="day-entry-images" type="button" data-uid="${r.uid}">買い目画像 ${images.length}枚</button>` : ""}
                        </div>
                    </div>
                `;
            }).join("");
        }

        function renderCalendar() {
            const y = parseInt(viewMonth.slice(0, 4), 10);
            const m = parseInt(viewMonth.slice(5, 7), 10);
            const first = new Date(y, m - 1, 1);
            const lastDay = new Date(y, m, 0).getDate();

            const offsetMon = (first.getDay() + 6) % 7;

            const monthRows = getRowsInMonth(viewMonth);
            const profitByDate = new Map();
            const countByDate = new Map();

            monthRows.forEach(r => {
                if (!r.date) return;
                const amount = Number(r.amount) || 0;
                const payout = Number(r.payout) || 0;
                const p = payout - amount;

                profitByDate.set(r.date, (profitByDate.get(r.date) || 0) + p);
                countByDate.set(r.date, (countByDate.get(r.date) || 0) + 1);
            });

            const totalSlots = offsetMon + lastDay;
            const weeks = Math.ceil(totalSlots / 7);
            const cellCount = weeks * 7;

            const cells = [];
            for (let i = 0; i < cellCount; i++) {
                const day = i - offsetMon + 1;

                if (day < 1 || day > lastDay) {
                    cells.push(`<div class="cal-cell outside"></div>`);
                    continue;
                }

                const dateStr = `${viewMonth}-${pad2(day)}`;
                const dow = new Date(y, m - 1, day).getDay();
                const weekClass = dow === 0 ? " sun" : (dow === 6 ? " sat" : "");
                const p = profitByDate.get(dateStr);
                const c = countByDate.get(dateStr) || 0;

                const isSel = dateStr === selectedDate;
                const amt = c ? formatYen(p) : "";
                const amtClass = c ? (p < 0 ? "neg" : (p > 0 ? "pos" : "")) : "";
                const selectedClass = isSel ? " selected" : "";

                cells.push(
                    `<div class="cal-cell${weekClass}${selectedClass}" data-date="${dateStr}">
                                <div class="cal-dayline">
                                    <div class="cal-daynum"><span class="cal-daychip">${day}</span></div>
                                </div>
                                ${c ? `<div class="cal-amt ${amtClass}">${amt}</div>` : ``}
                            </div>`
                );
            }

            calGrid.innerHTML = cells.join("");
        }

        function renderDayEditor() {
            dayTitle.textContent = selectedDate ? selectedDate : "";
            const list = rows
                .filter(r => r.date === selectedDate)
                .sort((a, b) => (a.uid || 0) - (b.uid || 0));

            if (list.length === 0) {
                dayList.innerHTML = "";
                dayEmpty.style.display = "";
                return;
            }

            dayEmpty.style.display = "none";
            dayList.innerHTML = list.map(r => {
                const amount = (Number(r.amount) || 0) ? formatYen(r.amount) : "";
                const payout = (Number(r.payout) || 0) ? formatYen(r.payout) : "";
                const buyer = r.buyer || "上田";

                return `
                            <div class="entry-row" data-uid="${r.uid}">
                                <input class="entry-date" type="date" value="${r.date}">
                                <input class="entry-amount" type="text" inputmode="numeric" value="${amount}">
                                <input class="entry-payout" type="text" inputmode="numeric" value="${payout}">
                                <select class="entry-buyer">
                                    <option value="上田" ${buyer === "上田" ? "selected" : ""}>上田</option>
                                    <option value="千葉" ${buyer === "千葉" ? "selected" : ""}>千葉</option>
                                </select>
                                <button class="delete-btn entry-delete" type="button">×</button>
                            </div>
                        `;
            }).join("");
        }

        function renderAll() {
            renderCalendar();
            calc();
        }

        function ensureSelectedInMonth() {
            if (!selectedDate) return;
            const ym = ymFromDate(selectedDate);
            if (ym && ym !== viewMonth) setViewMonth(ym);
        }

        function formatEditorTitle(d, isEdit) {
            if (!d || d.length < 10) return "";
            const mm = Number(d.slice(5, 7));
            const dd = Number(d.slice(8, 10));
            const s = `${mm}月${dd}日の収支を${isEdit ? "編集" : "入力"}`;
            return s;
        }

        function setEditorBuyer(b) {
            if (imageUploadInProgress || editorSaveInProgress) {
                showToast(imageUploadInProgress ? "画像のアップロードが終わるまでお待ちください" : "保存が終わるまでお待ちください");
                return;
            }
            const nextBuyer = b || "上田";
            if (nextBuyer !== editorBuyer && (editorUploadedImageIds.size || editorPendingImageFiles.length)) {
                clearPendingEditorImages();
                if (editorImageInput) editorImageInput.value = "";
                void discardPendingEditorUploads();
            }
            editorBuyer = nextBuyer;
            lastBuyer = editorBuyer;
            if (editingUid && !editorForceNew) {
                editingUid = null;
            }
            buyerBtns.forEach(x => {
                const on = (x.dataset.buyer || "上田") === editorBuyer;
                x.classList.toggle("active", on);
                x.setAttribute("aria-pressed", on ? "true" : "false");
            });
            loadEditorState();
        }

        function openEditor(d, options = {}) {
            const { buyer, uid, forceNew = false } = options;
            clearPendingEditorImages();
            if (editorImageInput) editorImageInput.value = "";
            editorUploadedImageIds = new Set();
            editorDate = d;
            editorForceNew = !!forceNew;
            editingUid = uid ?? null;
            if (buyer) editorBuyer = buyer;
            if (!editorBuyer) editorBuyer = lastBuyer || "上田";
            if (editingUid != null) {
                const row = rows.find(r => String(r.uid) === String(editingUid));
                if (row && row.buyer) editorBuyer = row.buyer;
            }
            buyerBtns.forEach(x => x.classList.toggle("active", (x.dataset.buyer || "上田") === editorBuyer));
            loadEditorState();
            if (editorOverlay) {
                editorOverlay.classList.add("show");
                editorOverlay.setAttribute("aria-hidden", "false");
            }
            document.body.classList.add("editor-open");
        }

        async function closeEditor({ discardUploads = true, force = false } = {}) {
            if (!force && (imageUploadInProgress || editorSaveInProgress)) {
                showToast(imageUploadInProgress ? "画像のアップロードが終わるまでお待ちください" : "保存が終わるまでお待ちください");
                return;
            }
            if (discardUploads) await discardPendingEditorUploads();
            editorImageDraft = [];
            clearPendingEditorImages();
            if (editorImageInput) editorImageInput.value = "";
            renderEditorImages();
            if (editorOverlay) {
                editorOverlay.classList.remove("show");
                editorOverlay.setAttribute("aria-hidden", "true");
            }
            document.body.classList.remove("editor-open");
        }

        function loadEditorState() {
            clearPendingEditorImages();
            if (editorImageInput) editorImageInput.value = "";
            const row = editingUid != null
                ? rows.find(r => String(r.uid) === String(editingUid))
                : (editorForceNew ? null : rows.find(r => r.date === editorDate && (r.buyer || "上田") === editorBuyer));
            editingUid = row ? row.uid : null;

            if (editorInvest) editorInvest.value = row && row.amount != null && row.amount !== 0 ? String(row.amount).replace(/[^\d]/g, "") : "";
            if (editorRecover) editorRecover.value = row && row.payout != null && row.payout !== 0 ? String(row.payout).replace(/[^\d]/g, "") : "";
            editorImageDraft = normalizeTicketImages(row && row.images);
            if (editorImageStatus) editorImageStatus.textContent = "";
            renderEditorImages();

            const isEdit = !!row;
            if (editorTitle) editorTitle.textContent = formatEditorTitle(editorDate, isEdit);
            if (editorDelete) editorDelete.style.display = isEdit ? "block" : "none";

            updateEditorProfit();
        }

        function renderEditorImages() {
            if (!editorImageList) return;
            const savedImages = editorImageDraft.map((image, index) => `
                <div class="ticket-image-item">
                    <span class="ticket-image-name">${escapeHtml(image.name)}</span>
                    <button class="ticket-image-button" type="button" data-image-action="view" data-image-index="${index}">表示</button>
                    <button class="ticket-image-remove" type="button" data-image-action="remove" data-image-index="${index}">削除</button>
                </div>
            `);
            const pendingImages = editorPendingImageFiles.map((pending, index) => `
                <div class="ticket-image-item is-pending">
                    <img class="ticket-image-thumbnail" src="${escapeHtml(pending.previewUrl)}" alt="">
                    <button class="ticket-image-remove" type="button" aria-label="選択した画像を削除" data-image-action="remove-pending" data-image-index="${index}">×</button>
                </div>
            `);
            editorImageList.innerHTML = [...savedImages, ...pendingImages].join("");
        }

        function clearPendingEditorImages() {
            for (const pending of editorPendingImageFiles) {
                if (pending.previewUrl) URL.revokeObjectURL(pending.previewUrl);
            }
            editorPendingImageFiles = [];
        }

        function queueEditorImages() {
            const files = Array.from(editorImageInput?.files || []);
            if (editorImageInput) editorImageInput.value = "";
            if (!files.length || imageUploadInProgress || editorSaveInProgress) return;

            let added = 0;
            for (const file of files) {
                const extension = file.name.split(".").pop().toLowerCase();
                const supportedByExtension = ["avif", "bmp", "gif", "heic", "heif", "jpeg", "jpg", "png", "tif", "tiff", "webp"].includes(extension);
                if ((!file.type.startsWith("image/") && !supportedByExtension) || file.type === "image/svg+xml") {
                    showToast(`${file.name}: 画像ファイルを選択してください`);
                    continue;
                }
                editorPendingImageFiles.push({ file, previewUrl: URL.createObjectURL(file) });
                added++;
            }
            if (editorImageStatus && added) editorImageStatus.textContent = "";
            renderEditorImages();
        }

        async function uploadEditorImages() {
            if (!editorPendingImageFiles.length) return true;

            imageUploadInProgress = true;
            if (editorImageInput) editorImageInput.disabled = true;
            if (editorImageStatus) editorImageStatus.textContent = "アップロードを準備しています…";
            let completed = 0;
            const total = editorPendingImageFiles.length;

            try {
                while (editorPendingImageFiles.length) {
                    const pending = editorPendingImageFiles[0];
                    const file = pending.file;
                    if (editorImageStatus) editorImageStatus.textContent = `アップロード中 ${completed + 1}/${total}`;

                    const response = await imageApiRequest("/images/upload", {
                        method: "POST",
                        headers: {
                            "Content-Type": file.type || "application/octet-stream",
                            "X-File-Name": encodeURIComponent(file.name)
                        },
                        body: file
                    });
                    const data = await response.json();
                    if (!data?.id) throw new Error("画像Workerから画像IDが返されませんでした");

                    const image = {
                        id: String(data.id),
                        name: file.name || "買い目画像",
                        type: String(data.type || file.type || "image/jpeg")
                    };
                    editorImageDraft.push(image);
                    editorUploadedImageIds.add(image.id);
                    editorPendingImageFiles.shift();
                    if (pending.previewUrl) URL.revokeObjectURL(pending.previewUrl);
                    completed++;
                    renderEditorImages();
                }
                if (editorImageStatus) editorImageStatus.textContent = completed ? "画像をアップロードしました。記録を保存しています…" : "";
                return true;
            } catch (error) {
                if (editorImageStatus) {
                    editorImageStatus.textContent = editorPendingImageFiles.length
                        ? `${editorPendingImageFiles.length}枚の画像が未アップロードです。保存を再試行できます`
                        : "";
                }
                showToast(imageErrorMessage(error), { type: "error" });
                return false;
            } finally {
                imageUploadInProgress = false;
                if (editorImageInput) editorImageInput.disabled = editorSaveInProgress;
            }
        }

        function handleEditorImageListClick(event) {
            const button = event.target.closest("[data-image-action]");
            if (!button) return;
            const index = Number(button.dataset.imageIndex);
            if (button.dataset.imageAction === "remove-pending") {
                const [removed] = editorPendingImageFiles.splice(index, 1);
                if (removed?.previewUrl) URL.revokeObjectURL(removed.previewUrl);
                if (editorImageStatus) editorImageStatus.textContent = "";
                renderEditorImages();
                return;
            }
            const image = editorImageDraft[index];
            if (!image) return;

            if (button.dataset.imageAction === "view") {
                openTicketImageViewer(editorImageDraft, `${formatDayLabel(editorDate)}・${editorBuyer}`, index);
            } else if (button.dataset.imageAction === "remove") {
                editorImageDraft.splice(index, 1);
                renderEditorImages();
            }
        }

        async function discardPendingEditorUploads() {
            const ids = Array.from(editorUploadedImageIds);
            editorUploadedImageIds.clear();
            if (!ids.length) return;
            const results = await Promise.allSettled(ids.map(id => imageApiRequest(`/images/${encodeURIComponent(id)}`, { method: "DELETE" })));
            if (results.some(result => result.status === "rejected")) {
                showToast("未保存の画像を削除できませんでした", { type: "error" });
            }
        }

        async function deleteStoredImages(images) {
            const ids = Array.from(new Set(normalizeTicketImages(images).map(image => image.id)));
            if (!ids.length) return true;
            const results = await Promise.allSettled(ids.map(id => imageApiRequest(`/images/${encodeURIComponent(id)}`, { method: "DELETE" })));
            const ok = results.every(result => result.status === "fulfilled");
            if (!ok) showToast("記録は保存されましたが、一部画像を削除できませんでした", { type: "error" });
            return ok;
        }

        function openTicketImageViewer(images, label = "", startIndex = 0) {
            viewerImages = normalizeTicketImages(images);
            if (!viewerImages.length) {
                showToast("表示できる画像がありません");
                return;
            }
            viewerImageIndex = Math.max(0, Math.min(startIndex, viewerImages.length - 1));
            ticketImageViewer.classList.add("show");
            ticketImageViewer.setAttribute("aria-hidden", "false");
            ticketImageViewer.dataset.label = label;
            void renderViewerImage();
        }

        async function renderViewerImage() {
            const token = ++viewerLoadToken;
            const image = viewerImages[viewerImageIndex];
            if (!image) return;
            if (viewerImageObjectUrl) URL.revokeObjectURL(viewerImageObjectUrl);
            viewerImageObjectUrl = "";
            ticketImageViewerImage.removeAttribute("src");
            ticketImageViewerTitle.textContent = `${ticketImageViewer.dataset.label || "買い目画像"}　${viewerImageIndex + 1}/${viewerImages.length}　${image.name}`;

            try {
                const response = await imageApiRequest(`/images/${encodeURIComponent(image.id)}`);
                const blob = await response.blob();
                if (token !== viewerLoadToken) return;
                viewerImageObjectUrl = URL.createObjectURL(blob);
                ticketImageViewerImage.src = viewerImageObjectUrl;
                ticketImageViewerImage.alt = image.name;
            } catch (error) {
                if (token === viewerLoadToken) showToast(imageErrorMessage(error), { type: "error" });
            }
        }

        function moveViewerImage(delta) {
            if (!viewerImages.length) return;
            viewerImageIndex = (viewerImageIndex + delta + viewerImages.length) % viewerImages.length;
            void renderViewerImage();
        }

        function closeTicketImageViewer() {
            viewerLoadToken++;
            ticketImageViewer.classList.remove("show");
            ticketImageViewer.setAttribute("aria-hidden", "true");
            ticketImageViewerImage.removeAttribute("src");
            if (viewerImageObjectUrl) URL.revokeObjectURL(viewerImageObjectUrl);
            viewerImageObjectUrl = "";
            viewerImages = [];
        }

        function updateEditorProfit() {
            const a = editorInvest ? Number(editorInvest.value) || 0 : 0;
            const p = editorRecover ? Number(editorRecover.value) || 0 : 0;
            const diff = p - a;

            if (!editorProfit) return;
            editorProfit.textContent = formatYen(diff);
            editorProfit.classList.remove("pos", "neg");
            if (diff > 0) editorProfit.classList.add("pos");
            if (diff < 0) editorProfit.classList.add("neg");
        }

        async function saveEditor() {
            if (!editorDate) return;
            if (imageUploadInProgress || editorSaveInProgress) {
                showToast(imageUploadInProgress ? "画像のアップロードが終わるまでお待ちください" : "保存中です。しばらくお待ちください");
                return;
            }
            editorSaveInProgress = true;
            if (editorImageInput) editorImageInput.disabled = true;

            try {
                if (!(await uploadEditorImages())) return;

                const a = editorInvest ? Number(editorInvest.value) || 0 : 0;
                const p = editorRecover ? Number(editorRecover.value) || 0 : 0;

                const existing = editingUid != null
                    ? rows.find(r => String(r.uid) === String(editingUid))
                    : (editorForceNew ? null : rows.find(r => r.date === editorDate && (r.buyer || "上田") === editorBuyer));
                const previousImages = normalizeTicketImages(existing && existing.images);
                let savedRow = existing;
                if (existing) {
                    existing.amount = a ? String(a) : "";
                    existing.payout = p ? String(p) : "";
                    existing.buyer = editorBuyer || "上田";
                    existing.images = normalizeTicketImages(editorImageDraft);
                } else {
                    savedRow = {
                        uid: uidSeq++,
                        date: editorDate,
                        amount: a ? String(a) : "",
                        payout: p ? String(p) : "",
                        buyer: editorBuyer || "上田",
                        images: normalizeTicketImages(editorImageDraft)
                    };
                    rows.push(savedRow);
                }
                editingUid = savedRow.uid;
                editorForceNew = false;

                calc();
                renderCalendar();


                rebuildYearOptions();
                applyYearFilter();

                const ok = await saveData();
                if (ok) {
                    const savedImageIds = new Set(normalizeTicketImages(savedRow.images).map(image => image.id));
                    const removedImages = [
                        ...previousImages,
                        ...Array.from(editorUploadedImageIds, id => ({ id }))
                    ].filter(image => !savedImageIds.has(image.id));
                    editorUploadedImageIds.clear();
                    await deleteStoredImages(removedImages);
                    await closeEditor({ discardUploads: false, force: true });
                } else if (savedRow) {
                    savedRow.images = previousImages;
                    if (editorImageStatus && editorUploadedImageIds.size) {
                        editorImageStatus.textContent = "画像はアップロード済みです。記録の保存を再試行してください";
                    }
                    calc();
                    renderCalendar();
                }
            } finally {
                editorSaveInProgress = false;
                if (editorImageInput) editorImageInput.disabled = false;
            }
        }

        async function deleteEditor() {
            if (imageUploadInProgress || editorSaveInProgress) {
                showToast(imageUploadInProgress ? "画像のアップロードが終わるまでお待ちください" : "保存が終わるまでお待ちください");
                return;
            }
            const row = editingUid != null
                ? rows.find(r => String(r.uid) === String(editingUid))
                : rows.find(r => r.date === editorDate && (r.buyer || "上田") === editorBuyer);
            if (!row) return;
            const imagesToDelete = [
                ...normalizeTicketImages(row.images),
                ...Array.from(editorUploadedImageIds, id => ({ id }))
            ];

            const originalIndex = rows.indexOf(row);
            rows = rows.filter(x => x.uid !== row.uid);

            calc();
            renderCalendar();


            rebuildYearOptions();
            applyYearFilter();

            const ok = await saveData({ message: "削除しました" });
            if (ok) {
                editorUploadedImageIds.clear();
                await deleteStoredImages(imagesToDelete);
                await closeEditor({ discardUploads: false });
            } else {
                rows.splice(Math.max(0, originalIndex), 0, row);
                editingUid = row.uid;
                calc();
                renderCalendar();
            }
        }

        function openEditorFromFab() {
            const today = todayJST();
            const d = selectedDate || (ymFromDate(today) === viewMonth ? today : (viewMonth ? `${viewMonth}-01` : today));
            selectedDate = d;
            ensureSelectedInMonth();
            renderCalendar();
            openEditor(d, { forceNew: true });
        }

        function addRow() {
            const today = todayJST();
            const d = selectedDate || (ymFromDate(today) === viewMonth ? today : (viewMonth ? `${viewMonth}-01` : today));
            selectedDate = d;
            ensureSelectedInMonth();
            renderCalendar();
            openEditor(d, { forceNew: true });
        }

        function removeRow(uid) {
            rows = rows.filter(r => String(r.uid) !== String(uid));
            renderAll();
        }

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                uidSeq = 1;
                rows = (Array.isArray(data) ? data : []).map(r => ({
                    uid: uidSeq++,
                    date: r.date || "",
                    amount: r.amount ?? "",
                    payout: r.payout ?? "",
                    buyer: r.buyer || "上田",
                    images: normalizeTicketImages(r.images)
                }));

                rebuildYearOptions();

                const today = todayJST();
                const todayYm = today.slice(0, 7);
                selectedDate = today;
                setViewMonth(todayYm);

                applyYearFilter();
            } catch (e) {
                showToast("読み込みに失敗しました");
                const todayYm = todayJST().slice(0, 7);
                setViewMonth(todayYm);
            }
        }

        async function saveData({ message = "保存しました" } = {}) {
            const payload = rows.map(r => {
                const images = normalizeTicketImages(r.images);
                return {
                    date: r.date,
                    amount: Number(r.amount) || 0,
                    payout: Number(r.payout) || 0,
                    buyer: r.buyer || "上田",
                    ...(images.length ? { images } : {})
                };
            });

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                showToast(message);
                return true;
            } catch {
                showToast("保存に失敗しました");
                return false;
            }
        }

        calGrid.addEventListener("click", e => {
            const cell = e.target.closest(".cal-cell");
            if (!cell || cell.classList.contains("outside")) return;
            const d = cell.dataset.date;
            if (!d) return;
            selectedDate = d;
            renderCalendar();
            updateDaySummary();
        });

        daySummaryList.addEventListener("click", e => {
            const imageButton = e.target.closest(".day-entry-images");
            if (imageButton) {
                const imageRow = rows.find(r => String(r.uid) === String(imageButton.dataset.uid));
                if (imageRow) openTicketImageViewer(imageRow.images, `${formatDayLabel(imageRow.date)}・${imageRow.buyer || "上田"}`);
                return;
            }

            const entry = e.target.closest(".day-summary-entry");
            if (!entry) return;
            const uid = entry.dataset.uid;
            const row = rows.find(r => String(r.uid) === String(uid));
            if (!row) return;
            selectedDate = row.date;
            ensureSelectedInMonth();
            renderCalendar();
            openEditor(row.date, { uid: row.uid, buyer: row.buyer, forceNew: false });
        });

        dayList.addEventListener("focusin", e => {
            const t = e.target;
            if (t && (t.classList.contains("entry-amount") || t.classList.contains("entry-payout"))) startEdit(t);
        });

        dayList.addEventListener("input", e => {
            const t = e.target;
            const rowEl = t && t.closest(".entry-row");
            if (!t || !rowEl) return;

            const uid = rowEl.dataset.uid;
            const r = rows.find(x => String(x.uid) === String(uid));
            if (!r) return;

            if (t.classList.contains("entry-amount")) {
                sanitizeNumberInput(t);
                r.amount = t.value ? parseYen(t.value) : "";
                calc();
                renderCalendar();
                return;
            }

            if (t.classList.contains("entry-payout")) {
                sanitizeNumberInput(t);
                r.payout = t.value ? parseYen(t.value) : "";
                calc();
                renderCalendar();
                return;
            }
        });

        dayList.addEventListener("focusout", e => {
            const t = e.target;
            if (!t) return;
            if (t.classList.contains("entry-amount") || t.classList.contains("entry-payout")) endEdit(t);
        });

        dayList.addEventListener("change", e => {
            const t = e.target;
            const rowEl = t && t.closest(".entry-row");
            if (!t || !rowEl) return;

            const uid = rowEl.dataset.uid;
            const r = rows.find(x => String(x.uid) === String(uid));
            if (!r) return;

            if (t.classList.contains("entry-date")) {
                r.date = t.value || r.date;
                selectedDate = r.date;
                ensureSelectedInMonth();
                renderAll();
                return;
            }

            if (t.classList.contains("entry-buyer")) {
                r.buyer = t.value;
                calc();
                renderCalendar();
                return;
            }
        });

        dayList.addEventListener("click", e => {
            const btn = e.target.closest(".entry-delete");
            if (!btn) return;
            if (!document.body.classList.contains("delete-mode")) return;
            const rowEl = btn.closest(".entry-row");
            if (!rowEl) return;
            removeRow(rowEl.dataset.uid);
        });

        monthPicker.addEventListener("change", () => {
            if (!monthPicker.value) return;
            setViewMonth(monthPicker.value);
        });

        if (yearFilter) yearFilter.addEventListener("change", () => applyYearFilter());
        setDeleteMode(false);
        loadData();
    </script>

</body>

</html>
