        function parseStatsRecord(stats) {
            const m = /\((\d+)-(\d+)-(\d+)-(\d+)(?:\s+[\d.]+%)?\)/.exec(stats || "");
            if (!m) return null;
            const wins = Number(m[1]);
            const seconds = Number(m[2]);
            const thirds = Number(m[3]);
            const others = Number(m[4]);
            if (![wins, seconds, thirds, others].every(Number.isFinite)) return null;
            return { wins, seconds, thirds, others, starts: wins + seconds + thirds + others };
        }

        function formatPersonStatsDisplay(stats) {
            const parsed = parseStatsRecord(stats);
            if (!parsed) return stats || "";
            const rate = parsed.starts > 0 ? (parsed.wins / parsed.starts) * 100 : 0;
            return `(${parsed.wins}-${parsed.seconds}-${parsed.thirds}-${parsed.others} ${rate.toFixed(1)}%)`;
        }

        function getRaceSurface(row) {
            const race = Number(row?.dataset?.race);
            if (!Number.isFinite(race) || race < 1 || race > TOTAL_RACES) return "";
            const course = extractCourse((window.raceCourses || [])[race - 1]);
            const m = course.match(/^(芝|ダ)/);
            return m ? m[1] : "";
        }

        function getProbabilityThresholdStarts(table, targetProbability) {
            if (!Array.isArray(table) || !table.length) return null;
            let best = null;
            for (const item of table) {
                const starts = Number(item?.starts);
                const probability = Number(item?.probability);
                if (!Number.isFinite(starts) || !Number.isFinite(probability)) continue;
                if (probability > targetProbability) continue;
                const diff = targetProbability - probability;
                if (!best || diff < best.diff || (diff === best.diff && starts < best.starts)) {
                    best = { starts, probability, diff };
                }
            }
            return best;
        }

        function getWinsProbabilityTable(person, winsMax = 1) {
            const tables = person === "trainer" ? trainerWinsProbabilityTables : jockeyWinsProbabilityTables;
            return tables[winsMax] || {};
        }

        function setWinsProbabilityTable(person, winsMax, table) {
            const tables = person === "trainer" ? trainerWinsProbabilityTables : jockeyWinsProbabilityTables;
            const current = tables[winsMax] || {};
            tables[winsMax] = { ...current, ...table };
        }

        function getWinsProbabilityThreshold(surface, person, winsMax = 1) {
            return getProbabilityThresholdStarts(getWinsProbabilityTable(person, winsMax)[surface], BG_PROBABILITY_TARGET);
        }

        function updateWinsProbabilityRuleLabel(person, winsMax, thresholds) {
            const key = `${person}Wins${winsMax}Prob3`;
            const rule = BACKGROUND_RULES.find(item => item.key === key);
            if (!rule) return;
            rule.probabilityLabel = `芝${formatSurfaceProbability(thresholds?.["芝"]?.best)} / ダ${formatSurfaceProbability(thresholds?.["ダ"]?.best)}`;
        }

        function applyProbabilityThresholdPayload(person, winsMax, thresholds) {
            if (!thresholds) return;
            updateWinsProbabilityRuleLabel(person, winsMax, thresholds);
            const nextTable = {};
            for (const surface of ["芝", "ダ"]) {
                const rows = thresholds[surface]?.rows;
                if (Array.isArray(rows) && rows.length) {
                    nextTable[surface] = rows.map(row => ({
                        starts: Number(row.starts),
                        probability: Number(row.probability)
                    })).filter(row => Number.isFinite(row.starts) && Number.isFinite(row.probability));
                }
            }
            if (nextTable["芝"] || nextTable["ダ"]) {
                setWinsProbabilityTable(person, winsMax, nextTable);
            }
        }

        async function fetchWinsProbabilityThresholds(person = "jockey", winsMax = 1) {
            const normalizedPerson = person === "all" ? "all" : (person === "trainer" ? "trainer" : "jockey");
            const parsedWinsMax = Number(winsMax);
            const normalizedWinsMax = Number.isFinite(parsedWinsMax)
                ? Math.max(0, Math.min(99, Math.trunc(parsedWinsMax)))
                : 1;
            try {
                const u = new URL("probability-thresholds", WIN5_API);
                u.searchParams.set("person", normalizedPerson);
                u.searchParams.set("winsMax", String(normalizedWinsMax));
                u.searchParams.set("target", String(BG_PROBABILITY_TARGET));
                u.searchParams.set("step", "1");
                const res = await fetch(u.toString(), { cache: "no-store" });
                const json = await res.json();
                if (!json.ok || !json.thresholds) return;

                if (normalizedPerson === "all") {
                    applyProbabilityThresholdPayload("jockey", normalizedWinsMax, json.thresholds.jockey);
                    applyProbabilityThresholdPayload("trainer", normalizedWinsMax, json.thresholds.trainer);
                    return;
                }

                applyProbabilityThresholdPayload(normalizedPerson, normalizedWinsMax, json.thresholds);
            } catch (e) {
                console.warn("fetchWinsProbabilityThresholds:", e);
            }
        }

        function hashString(value) {
            let hash = 0;
            const text = String(value || "");
            for (let i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
            }
            return Math.abs(hash);
        }

        function componentToHex(value) {
            const hex = Math.max(0, Math.min(255, Math.round(value))).toString(16);
            return hex.length === 1 ? "0" + hex : hex;
        }

        function hslToHex(h, s, l) {
            const hue = (((h % 360) + 360) % 360) / 360;
            const sat = Math.max(0, Math.min(100, s)) / 100;
            const light = Math.max(0, Math.min(100, l)) / 100;
            const q = light < 0.5 ? light * (1 + sat) : light + sat - light * sat;
            const p = 2 * light - q;
            const toRgb = t => {
                let v = t;
                if (v < 0) v += 1;
                if (v > 1) v -= 1;
                if (v < 1 / 6) return p + (q - p) * 6 * v;
                if (v < 1 / 2) return q;
                if (v < 2 / 3) return p + (q - p) * (2 / 3 - v) * 6;
                return p;
            };
            return `#${componentToHex(toRgb(hue + 1 / 3) * 255)}${componentToHex(toRgb(hue) * 255)}${componentToHex(toRgb(hue - 1 / 3) * 255)}`;
        }

        function generatedPersonRuleColor(index, usedColors) {
            let i = Math.max(0, Number(index) || 0);
            while (i < index + 720) {
                const color = hslToHex((i * 137.508 + 23) % 360, 72, 82);
                if (!usedColors.has(color)) return color;
                i++;
            }
            return hslToHex((index * 97 + 41) % 360, 65, 75);
        }

        function getPersonRuleColor(type, id) {
            const normalizedId = String(id || "").trim();
            refreshBackgroundRuleTargetMode();
            ensureUniqueBgRuleColors();
            const fixedRuleColors = new Set(
                BACKGROUND_RULES
                    .filter(isFixedColorRule)
                    .map(rule => bgRuleColors[rule.key])
                    .filter(Boolean)
            );
            const availableColors = PERSON_RULE_COLOR_POOL.filter(color => !fixedRuleColors.has(color));
            const baseColors = availableColors.length ? availableColors : PERSON_RULE_COLOR_POOL;
            if (!normalizedId) return baseColors[0];

            const keys = [...new Set(
                Array.from(document.querySelectorAll(".custom-select"))
                    .flatMap(sel => {
                        if (!isBackgroundRuleTarget(sel)) return [];
                        const items = [];
                        const jid = String(sel.dataset.jid || "").trim();
                        const tid = String(sel.dataset.tid || "").trim();
                        if (jid && isJockeyWithoutDailyMultiWin5Years(sel) && getSelectedJockeyRaceCount(sel) >= 2) {
                            items.push(`jockeyNoDaily:${jid}`);
                        }
                        if (tid && isTrainerWithoutDailyMultiWin5Years(sel) && getSelectedTrainerRaceCount(sel) >= 2) {
                            items.push(`trainerNoDaily:${tid}`);
                        }
                        if (jid && isJockeyPreviousWin5Winner(sel) && getSelectedJockeyPreviousWin5WinnerRaceCount(sel) >= 2) {
                            items.push(`jockeyPrevious:${jid}`);
                        }
                        if (tid && isTrainerPreviousWin5Winner(sel) && getSelectedTrainerPreviousWin5WinnerRaceCount(sel) >= 2) {
                            items.push(`trainerPrevious:${tid}`);
                        }
                        return items;
                    })
            )].sort();
            const targetKey = `${type}:${normalizedId}`;
            let index = keys.indexOf(targetKey);
            if (index < 0) index = keys.length + (hashString(targetKey) % 1000);
            if (index < baseColors.length) return baseColors[index];
            const usedColors = new Set([...fixedRuleColors, ...baseColors]);
            let generated = "";
            for (let i = baseColors.length; i <= index; i++) {
                generated = generatedPersonRuleColor(i - baseColors.length, usedColors);
                usedColors.add(generated);
            }
            return generated;
        }

        function getJockeyColor(row) {
            return getPersonRuleColor("jockeyNoDaily", row?.dataset?.jid);
        }

        function getTrainerColor(row) {

                } else {

        function getStatsKeysForModes(modes, raceInfo, raceCourses) {
            const modeSet = new Set(modes);
            const keysPerRace = [];
            for (let i = 0; i < TOTAL_RACES; i++) {
                const venue = modeSet.has('venue') ? extractVenue(raceInfo[i]) : "*";
                const course = extractCourse(raceCourses[i]);
                const surfaceMatch = course.match(/^(芝|ダ|障)/);
                const surface = surfaceMatch ? surfaceMatch[1] : "";
                const distanceMatch = course.match(/^(?:芝|ダ|障)(\d+)/);
                const distance = modeSet.has('distance') ? getDistanceCategory(distanceMatch ? Number(distanceMatch[1]) : null) : "*";
                keysPerRace.push((venue && surface && distance) ? `${venue}:${surface}:${distance}` : "");
            }
            return keysPerRace;
        }

        async function fetchAndApplyJockeyStats(personOverride = currentPerson, { updateDisplay = true, years = currentStatsYears, modes = currentStatsModes, datasetKey = null, save = true } = {}) {
            const raceInfo = window.raceInfo || [];
            const raceCourses = window.raceCourses || [];
            const statsModes = normalizeStatsModes(modes);
            const personAtFetch = personOverride;
            const targetDatasetKey = datasetKey || (personAtFetch === 'trainer' ? 'tstats' : 'jstats');
            const apiMode = 'combo';
            const keysPerRace = getStatsKeysForModes(statsModes, raceInfo, raceCourses);
            const validKeys = [...new Set(keysPerRace.filter(k => k))];
            if (datasetKey) {
                document.querySelectorAll('.custom-select').forEach(sel => {
                    sel.dataset[targetDatasetKey] = "";
                });
            }
            if (validKeys.length === 0) return;

            try {
                const cacheKey = JSON.stringify({
                    mode: apiMode,
                    years: String(years),
                    person: personAtFetch,
                    q: validKeys.join(",")
                });
                let json = statsFetchCache.get(cacheKey);
                if (!json) {
                    const u = new URL("stats", WIN5_API);
                    u.searchParams.set("mode", apiMode);
                    u.searchParams.set("years", years);
                    u.searchParams.set("person", personAtFetch);
                    u.searchParams.set("q", validKeys.join(","));
                    const res = await fetch(u.toString(), { cache: "no-store" });
                    json = await res.json();
                    if (json.ok && json.stats) statsFetchCache.set(cacheKey, json);
                }
                if (!json.ok || !json.stats) return;

                for (let r = 0; r < TOTAL_RACES; r++) {
                    const key = keysPerRace[r];
                    if (!key) continue;
                    const statsMap = json.stats[key];
                    if (!statsMap) continue;

                    document.querySelectorAll(`.custom-select[data-race="${r + 1}"]`).forEach(sel => {
                        if (sel.classList.contains("is-empty")) return;
                        if (sel.classList.contains("is-scratched")) return;
                        const id = (sel.dataset[personAtFetch === 'trainer' ? 'tid' : 'jid'] || "").trim();
                        if (!id) {
                            sel.dataset[targetDatasetKey] = "";
                            return;
                        }
                        const s = statsMap[id] || [0,0,0,0];
                        sel.dataset[targetDatasetKey] = `(${s[0]}-${s[1]}-${s[2]}-${s[3]})`;
                    });
                }
                if (updateDisplay && personAtFetch === currentPerson && targetDatasetKey === (personAtFetch === 'trainer' ? 'tstats' : 'jstats')) applyPersonDisplay();
                if (save) saveState();
            } catch (e) {
                console.warn("fetchAndApplyJockeyStats:", e);
            }
        }

        function syncMarkWinRangeOptions(minId, maxId, preferredMax) {
            const minEl = document.getElementById(minId);
            const maxEl = document.getElementById(maxId);
            if (!minEl || !maxEl) return;

            const minText = minEl.value;
            const minN = minText === "" ? null : Number(minText);
            const lo = Number.isFinite(minN) && minN >= 1 && minN <= TOTAL_RACES
                ? Math.trunc(minN)
                : null;
            const prevMaxText = preferredMax !== undefined ? String(preferredMax) : maxEl.value;
            const prevMax = prevMaxText === "" ? null : Number(prevMaxText);
            minEl.value = lo === null ? "" : String(lo);
            maxEl.replaceChildren();
            const blankOption = document.createElement('option');
            blankOption.value = "";
            blankOption.textContent = "";
            maxEl.appendChild(blankOption);
            const firstMax = lo === null ? 1 : lo;
            for (let n = firstMax; n <= TOTAL_RACES; n++) {
                const opt = document.createElement('option');
                opt.value = String(n);
                opt.textContent = String(n);
                maxEl.appendChild(opt);
            }
            const nextMax = prevMax === null
                ? ""
                : (Number.isFinite(prevMax) && prevMax >= firstMax && prevMax <= TOTAL_RACES
                    ? String(Math.trunc(prevMax))
                    : (lo === null ? "" : String(lo)));
            maxEl.value = nextMax;
        }

        function syncMaxFavOptions(preferredMax) {
            syncMarkWinRangeOptions('minFav', 'maxFav', preferredMax);
        }

        function syncMaxHimoOptions(preferredMax) {
            syncMarkWinRangeOptions('minHimo', 'maxHimo', preferredMax);
        }

            syncMarkWinRangeOptions('minNone', 'maxNone', preferredMax);

        function initMarkWinRangeControls() {
            const controls = [
                { minId: 'minFav', maxId: 'maxFav', sync: syncMaxFavOptions },
                { minId: 'minHimo', maxId: 'maxHimo', sync: syncMaxHimoOptions },
                { minId: 'minNone', maxId: 'maxNone', sync: syncMaxNoneOptions }
            ];
            controls.forEach(({ minId, maxId, sync }) => {
                const minEl = document.getElementById(minId);
                const maxEl = document.getElementById(maxId);
                if (!minEl || !maxEl) return;
                minEl.addEventListener('change', () => {
                    sync();
                    saveState();
                });
                maxEl.addEventListener('change', () => saveState());
                sync();
            });
        }

        createRaceTables();
        restoreState();
        updateStatsPopLabel();
        loadWin5Tabs();
        initMarkWinRangeControls();
        fitAll();
